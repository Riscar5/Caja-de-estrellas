const STORE_KEY = 'cajaEstrellas.v1';

/* Todo acceso a localStorage va protegido: en modo privado o con almacenamiento
   bloqueado el juego sigue funcionando en memoria y lo avisa en el panel adulto. */
const Store = {
  ok: true,
  read() {
    try {
      const raw = window.localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      this.ok = false;
      return null;
    }
  },
  write(data) {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify(data));
      this.ok = true;
      return true;
    } catch (err) {
      this.ok = false;
      return false;
    }
  },
  clear() {
    try { window.localStorage.removeItem(STORE_KEY); } catch (err) { this.ok = false; }
  }
};

const SENSORY_META = {
  low: {label:'Bajo estímulo', desc:'Fondo quieto, sin partículas, colores suaves, sonido muy bajo.', music:.08, sfx:.16, speed:0, reduced:true, icon:'leaf'},
  balanced: {label:'Equilibrado', desc:'El punto medio: feedback amable y movimiento justo.', music:.17, sfx:.27, speed:.25, reduced:false, icon:'balance'},
  high: {label:'Energía controlada', desc:'Un poco más de vida y micro-celebraciones, sin destellos.', music:.21, sfx:.33, speed:.5, reduced:false, icon:'sparkle'}
};
const SESSION_OPTIONS = [3, 5, 8];

function defaultSettings(sensory = 'balanced') {
  const meta = SENSORY_META[sensory] || SENSORY_META.balanced;
  return {
    sensory,
    music: meta.music,
    sfx: meta.sfx,
    voice: .7,
    voiceOn: false,
    dyslexia: false,
    reduced: meta.reduced,
    targetSpeed: meta.speed,
    rhythm: false,
    session: 3,
    muted: false
  };
}

function freshProfile(name, sensory = 'balanced', avatar) {
  const cleanName = String(name || 'Explorador').trim().slice(0, 16) || 'Explorador';
  return {
    id: 'p' + Date.now().toString(36) + Math.floor(Math.random() * 97),
    name: cleanName,
    created: Date.now(),
    avatar: sanitizeAvatar(avatar, cleanName),
    settings: defaultSettings(sensory),
    progress: {},
    facts: {},
    factLatAvg: 2400
  };
}

const State = {
  data: null,
  p: null,
  init() {
    const saved = Store.read();
    if (saved && Array.isArray(saved.profiles) && saved.profiles.length) {
      this.data = {
        version: 1,
        activeId: saved.activeId,
        profiles: saved.profiles.map(prof => this.sanitizeProfile(prof))
      };
      if (!this.data.profiles.some(p => p.id === this.data.activeId)) {
        this.data.activeId = this.data.profiles[0].id;
      }
    } else {
      this.data = {version: 1, activeId: null, profiles: []};
    }
    this.p = this.data.profiles.find(p => p.id === this.data.activeId) || null;
    this.applySenses();
  },
  sanitizeProfile(prof) {
    const sensory = SENSORY_META[prof.settings?.sensory] ? prof.settings.sensory : 'balanced';
    const base = freshProfile(prof.name || 'Explorador', sensory);
    base.id = prof.id || base.id;
    base.created = prof.created || Date.now();
    base.avatar = sanitizeAvatar(prof.avatar, prof.name || base.name);
    base.settings = Object.assign(base.settings, prof.settings || {}, {sensory});
    base.progress = (prof.progress && typeof prof.progress === 'object') ? prof.progress : {};
    base.facts = (prof.facts && typeof prof.facts === 'object') ? prof.facts : {};
    base.factLatAvg = Number(prof.factLatAvg) || 2400;
    return base;
  },
  save() { if (this.data) Store.write(this.data); },
  get settings() { return this.p ? this.p.settings : defaultSettings(); },
  use(id) {
    if (!this.data.profiles.some(p => p.id === id)) return;
    this.data.activeId = id;
    this.p = this.data.profiles.find(p => p.id === id);
    this.applySenses();
    this.save();
    Session.reset();
  },
  addProfile(name, sensory, avatar) {
    const prof = freshProfile(name, sensory, avatar);
    this.data.profiles.push(prof);
    this.data.activeId = prof.id;
    this.p = prof;
    this.applySenses();
    this.save();
    Session.reset();
    return prof;
  },
  removeProfile(id) {
    if (this.data.profiles.length <= 1) return false;
    this.data.profiles = this.data.profiles.filter(p => p.id !== id);
    if (this.data.activeId === id) {
      this.data.activeId = this.data.profiles[0].id;
      this.p = this.data.profiles[0];
    }
    this.save();
    this.applySenses();
    return true;
  },
  setSensory(sensory) {
    if (!this.p || !SENSORY_META[sensory]) return;
    const meta = SENSORY_META[sensory];
    this.p.settings.sensory = sensory;
    this.p.settings.music = meta.music;
    this.p.settings.sfx = meta.sfx;
    this.p.settings.targetSpeed = meta.speed;
    this.p.settings.reduced = meta.reduced;
    if (sensory === 'low') this.p.settings.rhythm = false;
    this.applySenses();
    this.save();
  },
  applySenses() {
    const s = this.settings;
    const html = document.documentElement;
    html.dataset.sensory = s.sensory || 'balanced';
    html.dataset.dyslexia = s.dyslexia ? 'true' : 'false';
    const systemReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    html.dataset.reduced = (s.reduced || systemReduced) ? 'true' : 'false';
    if (typeof Sound !== 'undefined') Sound.setPrefs(s);
    const muteBtn = $('#btnMute');
    if (muteBtn) {
      muteBtn.setAttribute('aria-pressed', s.muted ? 'true' : 'false');
      muteBtn.setAttribute('aria-label', s.muted ? 'Activar el sonido' : 'Silenciar el sonido');
      muteBtn.innerHTML = s.muted ? I.soundOff : I.soundOn;
    }
  },
  toggleMute() {
    if (!this.p) return;
    this.p.settings.muted = !this.p.settings.muted;
    this.applySenses();
    this.save();
    if (this.p.settings.muted) Voice.stop();
    else Sound.unlock(), Sound.pop(660);
    UI.toast(this.p.settings.muted ? 'Sonido apagado' : 'Sonido encendido');
  },
  worldProgress(worldId) {
    if (!this.p) return {stages:{}, gem:false, completed:false};
    if (!this.p.progress[worldId]) this.p.progress[worldId] = {stages:{}, gem:false, completed:false};
    const wp = this.p.progress[worldId];
    if (!wp.stages) wp.stages = {};
    return wp;
  },
  stage(worldId, stageId) {
    return this.worldProgress(worldId).stages[stageId] || {done:false, stars:0, plays:0};
  },
  anyDone(worldId) {
    const wp = this.p?.progress?.[worldId];
    return !!(wp && Object.values(wp.stages || {}).some(s => s && s.done));
  },
  unlocked(worldId) {
    return Number(worldId) === 1 || this.anyDone(Number(worldId) - 1);
  },
  worldStars(worldId) {
    const wp = this.p?.progress?.[worldId];
    if (!wp) return 0;
    return Object.values(wp.stages || {}).reduce((n, s) => n + (Number(s?.stars) || 0), 0);
  },
  nextStage(worldId) {
    for (const id of STAGE_ORDER) {
      if (!this.stage(worldId, id).done) return id;
    }
    return null;
  },
  stageAvailable(worldId, stageId) {
    if (!State.unlocked(worldId)) return false;
    const idx = STAGE_ORDER.indexOf(stageId);
    if (idx <= 0) return true;
    return this.stage(worldId, STAGE_ORDER[idx - 1]).done || this.stage(worldId, stageId).done;
  },
  award(worldId, stageId, stars) {
    const wp = this.worldProgress(worldId);
    const prev = wp.stages[stageId] || {done:false, stars:0, plays:0};
    const before = !!prev.done;
    wp.stages[stageId] = {
      done: true,
      stars: Math.max(Number(prev.stars) || 0, Number(stars) || 0),
      plays: (Number(prev.plays) || 0) + 1
    };
    if (stageId === 'reward') {
      wp.gem = true;
      wp.completed = true;
      wp.completedAt = wp.completedAt || Date.now();
    }
    this.save();
    return !before;
  },
  overall() {
    let done = 0, stars = 0;
    WORLDS.forEach(w => { if (this.stage(w.id, 'reward').done) done++; stars += this.worldStars(w.id); });
    return {worlds: done, stars};
  },
  resetProgress() {
    if (!this.p) return;
    this.p.progress = {};
    this.p.facts = {};
    this.p.factLatAvg = 2400;
    this.save();
    Session.reset();
  }
};

/* ---------- 3.1 Sesión y adaptación silenciosa ---------- */
const Session = {
  count: 0,
  stars: 0,
  creatures: 0,
  target: 3,
  shown: false,
  startedAt: Date.now(),
  reset() {
    this.count = 0; this.stars = 0; this.creatures = 0; this.shown = false;
    this.target = State.settings.session || 3; this.startedAt = Date.now();
  },
  note(stars = 0, creature = false) {
    if (!State.p) return;
    this.target = State.settings.session || 3;
    this.count++;
    this.stars += Number(stars) || 0;
    if (creature) this.creatures++;
  },
  complete() { return this.count >= this.target; },
  summaryNeeded() { return this.complete() && !this.shown; },
  markShown() { this.shown = true; }
};

const Adapt = {
  possibleForTable(t) {
    const set = new Set();
    for (let n = 1; n <= 10; n++) set.add(normFact(t, n));
    return [...set];
  },
  factsForWorld(world) {
    const set = new Map();
    const add = (a, b) => {
      const key = normFact(a, b);
      if (!set.has(key)) set.set(key, {a, b, key});
    };
    const tables = world.tables || [1];
    if (tables.length >= 8) {
      for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++) add(a, b);
      return [...set.values()];
    }
    tables.forEach(t => {
      for (let n = 1; n <= 10; n++) { add(t, n); add(n, t); }
    });
    return [...set.values()];
  },
  stat(key) {
    return State.p?.facts?.[key] || {c:0, w:0, n:0, last:0, latAvg:2400, rel:1, strat:{}};
  },
  weight(key) {
    const s = this.stat(key);
    const total = s.c + s.w;
    let weight = 1;
    if (s.n === 0) weight += 2.4;                 // lo que nunca se ha visto merece turno
    weight += Math.min(s.w, 5) * 2.2;              // lo fallado vuelve con calma
    if (total >= 3 && s.c / total < .72) weight += 1.6;
    if (s.last && Date.now() - s.last < 1000 * 60 * 30) weight *= .55; // repetición espaciada suave
    if (s.rel > 1.6) weight += .8;                 // respuestas lentas piden otra ocasión
    return Math.max(.15, weight);
  },
  pick(world, count = 3, exclude = []) {
    const pool = this.factsForWorld(world);
    const picked = [];
    const blocked = new Set(exclude);
    let guard = 0;
    while (picked.length < count && guard++ < 300) {
      const available = pool.filter(f => !blocked.has(f.key));
      if (!available.length) break;
      const weights = available.map(f => this.weight(f.key));
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      let chosen = available[available.length - 1];
      for (let i = 0; i < available.length; i++) {
        r -= weights[i];
        if (r <= 0) { chosen = available[i]; break; }
      }
      blocked.add(chosen.key);
      const swap = Math.random() < .5;
      picked.push({a: swap ? chosen.b : chosen.a, b: swap ? chosen.a : chosen.b, key: chosen.key});
    }
    return picked;
  },
  /* Guarda aciertos, fallos, estrategia y latencia relativa. Nunca se muestra al niño.
     La latencia relativa compara esta respuesta con la media previa del mismo hecho. */
  record(a, b, ok, strategy = 'directa', latency = 0) {
    if (!State.p) return;
    const key = normFact(a, b);
    const s = State.p.facts[key] || {c:0, w:0, n:0, last:0, latAvg:0, rel:1, strat:{}};
    const prior = s.latAvg || State.p.factLatAvg || 2400;
    s.n = (s.n || 0) + 1;
    if (ok) s.c = (s.c || 0) + 1; else s.w = (s.w || 0) + 1;
    s.last = Date.now();
    s.rel = Number(clamp(latency / Math.max(450, prior), .25, 4).toFixed(2));
    s.latAvg = s.latAvg ? Math.round(s.latAvg * .7 + latency * .3) : latency;
    s.strat = s.strat || {};
    s.strat[strategy] = (s.strat[strategy] || 0) + 1;
    State.p.facts[key] = s;
    State.p.factLatAvg = Math.round((State.p.factLatAvg || 2400) * .96 + latency * .04);
    State.save();
  },
  accuracy(key) {
    const s = this.stat(key);
    const n = s.c + s.w;
    return n ? s.c / n : null;
  },
  report() {
    const tables = [];
    for (let t = 1; t <= 10; t++) {
      const facts = this.possibleForTable(t);
      const seen = facts.filter(k => { const s = State.p?.facts?.[k]; return s && s.n > 0; });
      const mastered = facts.filter(k => {
        const s = State.p?.facts?.[k];
        if (!s || s.c < 2) return false;
        return s.c / Math.max(1, s.c + s.w) >= .8;
      });
      tables.push({table:t, possible:facts.length, seen:seen.length, mastered:mastered.length});
    }
    const weak = Object.entries(State.p?.facts || {})
      .filter(([, s]) => s.w > 0)
      .map(([key, s]) => ({key, w:s.w, c:s.c, acc:s.c / Math.max(1, s.c + s.w), weight:this.weight(key)}))
      .sort((a, b) => b.weight - a.weight)
      .slice(0, 4);
    return {tables, weak};
  }
};

/* ---------- 3.2 Audio sintetizado (sin archivos) ---------- */
const Sound = {
  ctx: null,
  master: null,
  musicGain: null,
  sfxGain: null,
  noiseBuf: null,
  prefs: {music:.17, sfx:.27, muted:false},
  timer: null,
  tick: 0,
  layers: 1,
  paused: false,
  available: true,
  setPrefs(settings) {
    this.prefs = {music:settings.music, sfx:settings.sfx, muted:!!settings.muted};
    this.applyGains();
  },
  applyGains() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.prefs.muted ? 0 : 1, t, .04);
    this.musicGain.gain.setTargetAtTime(this.prefs.muted ? 0 : Math.max(.0001, this.prefs.music * .55), t, .08);
    this.sfxGain.gain.setTargetAtTime(this.prefs.muted ? 0 : Math.max(.0001, this.prefs.sfx), t, .04);
  },
  init() {
    if (this.ctx || !this.available) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.available = false; return; }
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.prefs.muted ? 0 : 1;
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 18; comp.ratio.value = 4;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.sfxGain = this.ctx.createGain();
      this.musicGain.connect(this.master);
      this.sfxGain.connect(this.master);
      const len = this.ctx.sampleRate * .8;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.applyGains();
    } catch (err) {
      this.available = false;
      this.ctx = null;
    }
  },
  unlock() {
    this.init();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    this.startMusic();
  },
  setLayers(n) {
    this.layers = clamp(n, 1, 4);
  },
  env(gain, t, attack, hold, release, peak) {
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t + attack);
    gain.gain.setValueAtTime(Math.max(.0002, peak), t + attack + hold);
    gain.gain.exponentialRampToValueAtTime(.0001, t + attack + hold + release);
  },
  tone(freq, dur = .25, opts = {}) {
    if (!this.ctx || this.prefs.muted) return;
    const {type = 'sine', gain = .12, attack = .008, hold = .01, slide = null, delay = 0, dest = null} = opts;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
    this.env(g, t, attack, hold, Math.max(.03, dur), gain);
    osc.connect(g); g.connect(dest || this.sfxGain);
    osc.start(t); osc.stop(t + dur + attack + .08);
  },
  marimba(freq, gain = .13, delay = 0) {
    this.tone(freq, .65, {type:'sine', gain, attack:.004, hold:.01, delay, dest:this.sfxGain});
    this.tone(freq * 4, .18, {type:'sine', gain:gain * .16, attack:.003, delay, dest:this.sfxGain});
  },
  glock(freq, gain = .09, delay = 0) {
    this.tone(freq, .9, {type:'sine', gain, attack:.003, hold:.006, delay, dest:this.sfxGain});
    this.tone(freq * 2.76, .28, {type:'sine', gain:gain * .2, attack:.002, delay, dest:this.sfxGain});
  },
  pop(freq = 520) {
    this.tone(freq, .08, {type:'triangle', gain:.11, attack:.004, slide:freq * 1.7});
  },
  tap() { this.pop(600); },
  whoosh() {
    if (!this.ctx || this.prefs.muted || !this.noiseBuf) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.Q.value = .9;
    filter.frequency.setValueAtTime(360, t);
    filter.frequency.exponentialRampToValueAtTime(1500, t + .18);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.045, t + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    src.connect(filter); filter.connect(g); g.connect(this.sfxGain);
    src.start(t); src.stop(t + .3);
  },
  success() {
    [523.25, 659.25, 783.99].forEach((f, i) => this.glock(f, .075, i * .075));
    this.marimba(392, .06, .2);
  },
  neutral() {
    this.tone(349.23, .16, {type:'sine', gain:.052, attack:.008});
    this.tone(293.66, .3, {type:'sine', gain:.045, attack:.008, delay:.1});
  },
  star() {
    [523.25, 587.33, 659.25, 783.99, 880].forEach((f, i) => this.glock(f, .06, i * .085));
    this.marimba(261.63, .05, .42);
  },
  hatch() {
    if (!this.ctx || this.prefs.muted) return;
    for (let i = 0; i < 7; i++) {
      this.tone(392 * Math.pow(2, i / 12), .22, {type:'sine', gain:.035, delay:i * .09, dest:this.sfxGain});
    }
    this.glock(1046.5, .05, .58);
    this.pop(700);
  },
  merge() {
    [523.25, 587.33, 659.25, 783.99].forEach((f, i) => this.marimba(f, .055, i * .08));
  },
  musicStep() {
    if (!this.ctx || this.prefs.muted || this.paused) return;
    const penta = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880];
    const t = this.tick++;
    const music = this.musicGain;
    const note = (f, dur, gain, type = 'sine', hold = .05) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.value = f;
      const now = this.ctx.currentTime;
      g.gain.setValueAtTime(.0001, now);
      g.gain.exponentialRampToValueAtTime(gain, now + .25);
      g.gain.exponentialRampToValueAtTime(.0001, now + dur);
      osc.connect(g); g.connect(music);
      osc.start(now); osc.stop(now + dur + .1);
    };
    if (t % 4 === 0) {
      note(130.81, 7.5, .028, 'triangle');
      note(196, 7.5, .016, 'sine');
    }
    if (this.layers >= 2) {
      const seq = [523.25, 659.25, 783.99, 659.25, 587.33, 523.25, 440, 523.25];
      const f = seq[t % seq.length];
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      const now = this.ctx.currentTime;
      g.gain.setValueAtTime(.0001, now);
      g.gain.exponentialRampToValueAtTime(.022, now + .02);
      g.gain.exponentialRampToValueAtTime(.0001, now + 1.5);
      osc.connect(g); g.connect(music);
      osc.start(now); osc.stop(now + 1.6);
    }
    if (this.layers >= 3 && t % 4 === 2) {
      const f = penta[(t + 4) % penta.length] * 2;
      note(f, 2.4, .011, 'sine');
    }
    if (this.layers >= 4 && t % 8 === 5) {
      note(98, 4.5, .022, 'triangle');
    }
  },
  startMusic() {
    if (!this.ctx || this.timer) return;
    this.timer = setInterval(() => this.musicStep(), 2100);
    this.musicStep();
  },
  stopMusic() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  },
  pause() { this.paused = true; },
  resume() { this.paused = false; if (this.ctx) this.startMusic(); },
  refreshLayers() {
    const done = State.overall().worlds;
    this.setLayers(1 + done);
  }
};

/* ---------- 3.3 Voz opcional ---------- */
const Voice = {
  supported: (typeof window !== 'undefined' && 'speechSynthesis' in window),
  current: null,
  say(text, force = false) {
    if (!this.supported || !text) return;
    const s = State.settings;
    if (!force && !s.voiceOn) return;
    if (s.muted) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, ' ').trim());
      u.lang = 'es-ES';
      u.rate = .93; u.pitch = 1.04;
      u.volume = clamp(Number(s.voice) || .7, 0, 1);
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => /es[-_](ES|MX|AR|CO)/i.test(v.lang)) || voices.find(v => /^es/i.test(v.lang));
      if (preferred) u.voice = preferred;
      this.current = u;
      window.speechSynthesis.speak(u);
    } catch (err) { /* La voz es un extra: si falla, el juego continúa en silencio. */ }
  },
  auto(text) { this.say(text, false); },
  stop() {
    if (!this.supported) return;
    try { window.speechSynthesis.cancel(); this.current = null; } catch (err) {}
  }
};

/* ---------- 3.4 Partículas (Canvas 2D, solo decoración) ---------- */
const Particles = {
  canvas: null,
  ctx: null,
  list: [],
  running: false,
  dpr: 1,
  init() {
    this.canvas = $('#particles');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.resize();
  },
  resize() {
    if (!this.canvas) return;
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = Math.floor(window.innerWidth * this.dpr);
    this.canvas.height = Math.floor(window.innerHeight * this.dpr);
  },
  enabled() {
    return !lowNow() && !reducedNow() && !document.hidden;
  },
  burst(x, y, opts = {}) {
    if (!this.enabled() || !this.ctx) return;
    const count = Math.round((opts.count || 16) * (highNow() ? 1.35 : 1));
    const colors = opts.colors || ['#F2C14E', '#8ED8C8', '#E99A72', '#B7A6E6'];
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 1.2 + Math.random() * (opts.spread || 2.8);
      this.list.push({
        x: x * this.dpr, y: y * this.dpr,
        vx: Math.cos(a) * speed * this.dpr,
        vy: Math.sin(a) * speed * this.dpr - (opts.lift || 1.1) * this.dpr,
        life: 0, max: 40 + Math.random() * 40,
        size: (2 + Math.random() * 3) * this.dpr,
        color: colors[i % colors.length],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - .5) * .18,
        petal: !!opts.petal
      });
    }
    this.list = this.list.slice(-160);
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.frame()); }
  },
  celebrate() {
    if (!this.enabled()) return;
    const w = window.innerWidth, h = window.innerHeight;
    this.burst(w * .5, h * .34, {count:34, spread:4, lift:1.8, petal:true});
    setTimeout(() => this.burst(w * .32, h * .42, {count:18, spread:3, lift:1.2}), 160);
    setTimeout(() => this.burst(w * .68, h * .42, {count:18, spread:3, lift:1.2}), 300);
  },
  frame() {
    if (!this.ctx || !this.canvas) { this.running = false; return; }
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.list = this.list.filter(p => p.life < p.max);
    this.list.forEach(p => {
      p.life++;
      p.x += p.vx; p.y += p.vy;
      p.vy += .055 * this.dpr;
      p.vx *= .995;
      p.rot += p.vr;
      const alpha = Math.max(0, 1 - p.life / p.max);
      this.ctx.save();
      this.ctx.globalAlpha = alpha;
      this.ctx.translate(p.x, p.y);
      this.ctx.rotate(p.rot);
      this.ctx.fillStyle = p.color;
      if (p.petal) {
        this.ctx.beginPath();
        this.ctx.ellipse(0, 0, p.size * .8, p.size * .45, 0, 0, Math.PI * 2);
        this.ctx.fill();
      } else {
        this.ctx.beginPath();
        this.ctx.moveTo(0, -p.size);
        this.ctx.lineTo(p.size * .5, 0);
        this.ctx.lineTo(0, p.size);
        this.ctx.lineTo(-p.size * .5, 0);
        this.ctx.closePath();
        this.ctx.fill();
      }
      this.ctx.restore();
    });
    if (this.list.length) requestAnimationFrame(() => this.frame());
    else { this.running = false; this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
  }
};

const App = {
  paused: false,
  route: null,
  init() {
    State.init();
    Particles.init();
    this.bindGlobal();
    if (!State.p) UI.go('welcome');
    else UI.go('hub');
  },
  bindGlobal() {
    $('#btnHome').addEventListener('click', () => {
      if (UI.route.name !== 'hub') UI.go('hub');
    });
    $('#btnMute').addEventListener('click', () => State.toggleMute());
    $('#btnPause').addEventListener('click', () => UI.openPause());
    let unlocked = false;
    const unlock = () => {
      if (unlocked) return;
      unlocked = true;
      Sound.unlock();
      Sound.refreshLayers();
      Sound.setPrefs(State.settings);
    };
    window.addEventListener('pointerdown', unlock, {once:true, passive:true});
    window.addEventListener('keydown', unlock, {once:true});
    window.addEventListener('resize', () => {
      Particles.resize();
      clearTimeout(this._rt);
      this._rt = setTimeout(() => { if (UI.route?.name === 'hub') Hub.layoutMap(); }, 140);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        Voice.stop();
        Sound.stopMusic();
      } else if (State.p) {
        Sound.startMusic();
        Particles.resize();
      }
    });
    window.addEventListener('pagehide', () => { State.save(); Voice.stop(); });
  }
};

const UI = {
  route: {name:'hub', params:{}},
  modalEl: null,
  prevFocus: null,
  toastTimer: null,
  go(name, params = {}) {
    if (this.modalEl) this.closeModal(true);
    Voice.stop();
    if (typeof Activities !== 'undefined') Activities.destroy();
    this.route = {name, params};
    App.paused = false;
    const screen = (SCREENS[name] || SCREENS.hub)(params);
    const out = typeof screen === 'string' ? {html:screen} : screen;
    const main = $('#main');
    main.innerHTML = out.html;
    window.scrollTo(0, 0);
    this.updateChrome();
    if (out.after) {
      try { out.after(); } catch (err) { console.error('Error al montar la pantalla', err); }
    }
    const h = $('#main h1');
    if (h) {
      h.setAttribute('tabindex', '-1');
      h.focus({preventScroll:true});
    }
    if (out.speech) Voice.auto(out.speech);
    if (name === 'hub' || name === 'world') {
      setTimeout(() => this.maybeSummary(), 550);
    }
  },
  restart() { this.go(this.route.name, this.route.params); },
  updateChrome() {
    const name = this.route.name;
    const hasProfile = !!State.p;
    const home = $('#btnHome');
    const mute = $('#btnMute');
    const pause = $('#btnPause');
    const hideHome = name === 'hub' || name === 'welcome';
    home.classList.toggle('is-hidden', hideHome);
    home.disabled = hideHome;
    home.setAttribute('aria-hidden', hideHome ? 'true' : 'false');
    mute.style.display = hasProfile && name !== 'welcome' ? 'grid' : 'none';
    pause.style.display = name === 'welcome' ? 'none' : 'grid';
    const s = State.settings;
    mute.setAttribute('aria-pressed', s.muted ? 'true' : 'false');
    mute.setAttribute('aria-label', s.muted ? 'Activar el sonido' : 'Silenciar el sonido');
    mute.innerHTML = s.muted ? I.soundOff : I.soundOn;
    let fraction = 0;
    const worldId = this.route.params?.worldId || (name === 'world' ? this.route.params.id : null);
    if (worldId) {
      const wp = State.worldProgress(worldId);
      const done = STAGE_ORDER.filter(st => wp.stages[st]?.done).length;
      fraction = done / STAGE_ORDER.length;
    } else {
      const overall = State.overall();
      fraction = overall.worlds / WORLDS.length;
    }
    const fill = $('#globalFill');
    if (fill) fill.style.width = Math.round(clamp(fraction, 0, 1) * 100) + '%';
    document.title = this.titleFor(name) + ' · Caja de Estrellas';
  },
  titleFor(name) {
    const map = {
      hub:'Mapa', welcome:'Bienvenida', world:'Mundo', discover:'Descubrir', bars:'Barras',
      target:'Tiro de estrellas', connect:'El trazo', boss:'El guardián', why:'¿Por qué funciona?',
      reward:'Una nueva amiga', album:'Álbum', adult:'Adultos', coming:'Próximamente'
    };
    return map[name] || 'Caja de Estrellas';
  },
  toast(msg, ms = 2600) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    announce(msg);
  },
  starRow(stars, max = 3) {
    let out = '';
    for (let i = 0; i < max; i++) out += `<svg class="${i < stars ? 'on' : ''}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.8 5.6 6.2.9-4.5 4.3 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.5l6.2-.9z"/></svg>`;
    return `<span class="stage-stars" role="img" aria-label="${stars} de ${max} estrellas">${out}</span>`;
  },
  starsBig(stars) {
    let out = '';
    for (let i = 0; i < 3; i++) out += `<svg class="${i < stars ? 'on' : ''}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.8 5.6 6.2.9-4.5 4.3 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.5l6.2-.9z"/></svg>`;
    return `<div class="stars-big" role="img" aria-label="${stars} de 3 estrellas">${out}</div>`;
  },
  progressDots(done, total, label) {
    let out = '';
    for (let i = 0; i < total; i++) out += `<span class="progress-dot ${i < done ? 'done' : ''} ${i === done ? 'now' : ''}"></span>`;
    return `<div class="progress-dots" aria-hidden="true">${out}<span class="progress-label">${esc(label || '')}</span></div>`;
  },
  modal({title, body, actions = '', center = false, closable = true, onClose = null}) {
    if (this.modalEl) this.closeModal(true);
    this.prevFocus = document.activeElement;
    const id = uid();
    const root = $('#modalRoot');
    root.innerHTML = `<div class="overlay" id="overlay-${id}">
      <div class="modal ${center ? 'modal-center' : ''}" role="dialog" aria-modal="true" aria-labelledby="mt-${id}">
        ${closable ? `<button class="icon-btn modal-close" type="button" data-close aria-label="Cerrar">${I.close}</button>` : ''}
        <h2 id="mt-${id}">${esc(title)}</h2>
        <div class="modal-body">${body || ''}</div>
        ${actions ? `<div class="modal-actions">${actions}</div>` : ''}
      </div>
    </div>`;
    this.modalEl = root.firstElementChild;
    this.modalOnClose = onClose;
    const app = $('#app');
    if (app && 'inert' in app) app.inert = true;
    document.body.style.overflow = 'hidden';
    const focusables = this.modalEl.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusables.length) setTimeout(() => focusables[0].focus(), 30);
    this.modalEl.addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) this.closeModal();
    });
    this.modalEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const f = Array.from(this.modalEl.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), select, textarea, [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    return this.modalEl;
  },
  closeModal(silent = false) {
    if (!this.modalEl) return;
    const onClose = this.modalOnClose;
    this.modalEl = null;
    this.modalOnClose = null;
    const root = $('#modalRoot');
    if (root) root.innerHTML = '';
    const app = $('#app');
    if (app && 'inert' in app) app.inert = false;
    document.body.style.overflow = '';
    if (this.prevFocus && document.contains(this.prevFocus)) this.prevFocus.focus({preventScroll:true});
    this.prevFocus = null;
    if (!silent && onClose) onClose();
  },
  openPause() {
    if (this.modalEl) return;
    Voice.stop();
    App.paused = true;
    Sound.pause();
    const muted = State.settings.muted;
    const m = this.modal({
      title:'Pausa',
      body:`<p>Respira. Aquí no hay reloj y nada se pierde.</p>
        <div class="pause-help">
          <div class="ph-row"><span class="ph-ic">${I.hand}</span><span>Arrastra las cartas o tócalas para colocarlas.</span></div>
          <div class="ph-row"><span class="ph-ic">${I.balance}</span><span>Las dos bandejas necesitan el mismo peso.</span></div>
          <div class="ph-row"><span class="ph-ic">${I.bulb}</span><span>La pista está siempre a mano. Úsala sin miedo.</span></div>
        </div>`,
      actions:`<button class="btn btn-ghost btn-small" type="button" data-pause-mute>${muted ? 'Activar sonido' : 'Silenciar'}</button>
        <button class="btn btn-ghost btn-small" type="button" data-pause-home>Volver al mapa</button>
        <button class="btn btn-primary" type="button" data-close>Continuar</button>`,
      onClose:() => { App.paused = false; Sound.resume(); }
    });
    const muteBtn = m.querySelector('[data-pause-mute]');
    muteBtn?.addEventListener('click', () => {
      State.toggleMute();
      App.paused = true;
      muteBtn.textContent = State.settings.muted ? 'Activar sonido' : 'Silenciar';
    });
    m.querySelector('[data-pause-home]')?.addEventListener('click', () => {
      UI.closeModal(true);
      App.paused = false;
      Sound.resume();
      UI.go('hub');
    });
  },
  finishActivity({worldId, stageId, stars, title, note, stats = [], repeat}) {
    const world = worldById(worldId);
    const wasDone = State.stage(worldId, stageId).done;
    State.award(worldId, stageId, stars);
    if (!wasDone) Session.note(stars, false);
    Sound.star();
    if (!lowNow()) Particles.celebrate();
    const root = $('#activityRoot');
    if (!root) return;
    const statsHtml = stats.map(([k, v]) => `<span>${esc(k)} <strong>${esc(String(v))}</strong></span>`).join('');
    root.innerHTML = `<div class="result">
      <div class="swirl" aria-hidden="true">${I.swirl}</div>
      <p class="kicker">Mundo ${worldId} · ${esc(stageTitle(world, stageId).title)}</p>
      <h1>${esc(title)}</h1>
      ${this.starsBig(stars)}
      <p class="hand">${esc(note)}</p>
      <div class="result-stats">${statsHtml}</div>
      <div class="actions">
        <button class="btn btn-primary" type="button" data-res="next">Seguir</button>
        <button class="btn btn-ghost btn-small" type="button" data-res="again">Repetir</button>
      </div>
    </div>`;
    const live = `¡Bien! ${stars} de 3 estrellas.`;
    announce(live);
    root.querySelector('[data-res="next"]')?.addEventListener('click', () => UI.go('world', {id:worldId}));
    root.querySelector('[data-res="again"]')?.addEventListener('click', () => {
      if (typeof repeat === 'function') repeat(); else UI.restart();
    });
    this.updateChrome();
  },
  maybeSummary() {
    if (!Session.summaryNeeded()) return;
    if (this.modalEl) return;
    if (!State.p) return;
    Session.markShown();
    const s = Session;
    const body = `<p>Has completado <strong>${s.count} retos</strong>. Puedes seguir o dejarlo aquí: las dos cosas están bien.</p>
      <div class="summary-grid">
        <div class="summary-stat"><strong>${s.count}</strong><span>retos</span></div>
        <div class="summary-stat"><strong>${s.stars}</strong><span>estrellas</span></div>
        <div class="summary-stat"><strong>${s.creatures}</strong><span>amigas nuevas</span></div>
      </div>
      <p class="tiny">Mañana la caja seguirá aquí, con las mismas estrellas.</p>`;
    this.modal({
      title:'Un buen rato de hoy',
      body,
      center:true,
      actions:`<button class="btn btn-ghost btn-small" type="button" data-sum-home>Hasta aquí</button>
        <button class="btn btn-primary" type="button" data-close>Seguir un poco</button>`
    });
    $('#modalRoot [data-sum-home]')?.addEventListener('click', () => { UI.closeModal(true); UI.go('hub'); });
  }
};

              <span class="hold-ring" aria-hidden="true"></span>${I.lock}<span>Adultos</span>
            </button>
            <span id="adultHint" class="sr-only">Zona de adultos. Mantén pulsado dos segundos para entrar.</span>
          </div>
        </div>
        <p class="footer-note">Un lugar para practicar sin miedo a equivocarse.</p>
      </div>
    </section>`;
  },
  mapHTML() {
    const completed = State.overall().worlds;
    const nodes = WORLDS.map(w => {
      const done = State.stage(w.id, 'reward').done;
      const unlocked = State.unlocked(w.id);
      const cls = done ? 'done' : !w.ready ? 'soon' : !unlocked ? 'locked' : 'open';
      const stars = State.worldStars(w.id);
      const badge = done ? `<span class="map-stars">${I.star}${stars}</span>` : !unlocked ? `<span class="map-lock" aria-hidden="true">${I.lock}</span>` : '';
      const sub = !w.ready ? `<span class="map-soon">Próximamente</span>` : `<span class="map-sub">${esc(w.label)}</span>`;
      const label = done ? 'Completado' : !w.ready ? 'Próximamente' : !unlocked ? 'Se abre al completar una actividad del mundo anterior' : 'Disponible';
      return `<li class="map-node ${cls}" data-world="${w.id}" style="left:0;top:0">
        <button class="map-btn" type="button" data-open-world="${w.id}" aria-label="Mundo ${w.id}: ${esc(w.name)}. ${label}" ${!w.ready || !unlocked ? '' : ''}>
          <span class="map-orb" style="--node-soft:${w.soft};--node-line:${w.accent}">${creatureArt(w.creature)}<span class="map-num">${w.id}</span>${badge}</span>
          <span class="map-name">${esc(w.name)}</span>
          ${sub}
        </button>
      </li>`;
    }).join('');
    const blooms = [[12,16],[86,22],[20,54],[82,63],[12,83],[88,88]].map(([x, y], i) => {
      const on = completed >= [1, 2, 3, 5, 8, 12][i];
      return `<span class="map-bloom ${on ? 'on' : ''}" style="left:${x}%;top:${y}%" aria-hidden="true">${this.flower(i)}</span>`;
    }).join('');
    return `<div class="map-board" id="mapBoard">
      ${blooms}
      <svg class="map-svg" id="mapSvg" aria-hidden="true"><path class="map-trail" id="mapTrail"></path><path class="map-trail-done" id="mapTrailDone" pathLength="100" stroke-dasharray="0 100"></path></svg>
      <ol style="margin:0;padding:0;height:100%;position:relative">${nodes}</ol>
    </div>`;
  },
  flower(i) {
    const colors = [['#E89A74','#F6D77C'],['#8ED8C8','#FFF1BF'],['#B7A6E6','#F6D77C'],['#E89A74','#CDE7DE'],['#F2C14E','#F6C6A4'],['#9ED9D4','#F7E5B8']][i % 6];
    return `<svg viewBox="0 0 40 40"><g transform="translate(20 22)"><path d="M0 7v11" stroke="#6F9D7C" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="-5" cy="12" rx="5" ry="3" fill="#8FBE9A" transform="rotate(-24 -5 12)"/><circle cx="0" cy="-5" r="5.4" fill="${colors[0]}"/><circle cx="9" cy="0" r="5.4" fill="${colors[0]}"/><circle cx="5" cy="8" r="5.4" fill="${colors[0]}"/><circle cx="-6" cy="7" r="5.4" fill="${colors[0]}"/><circle cx="-9" cy="-1" r="5.4" fill="${colors[0]}"/><circle cx="0" cy="1" r="4" fill="${colors[1]}"/></g></svg>`;
  },
  after() {
    const section = $('#mapSection');
    if (!section) return;
    this.layoutMap();
    requestAnimationFrame(() => this.layoutMap());
    $('#mapBoard')?.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-open-world]');
      if (!btn) return;
      const id = Number(btn.dataset.openWorld);
      const w = worldById(id);
      Sound.tap();
      if (!w.ready) { UI.go('coming', {id}); return; }
      if (!State.unlocked(id)) {
        UI.toast(`Primero una actividad del Mundo ${id - 1}. Así el mapa crece contigo.`);
        Sound.neutral();
        return;
      }
      UI.go('world', {id});
    });
    $('[data-continue]')?.addEventListener('click', (e) => {
      const id = Number(e.currentTarget.dataset.continue);
      const stage = e.currentTarget.dataset.stage;
      this.startStage(id, stage);
    });
    $('[data-album]')?.addEventListener('click', () => UI.go('album'));
    const gate = $('#adultGate');
    if (gate) this.bindAdultGate(gate);
  },
  startStage(worldId, stageId) {
    const w = worldById(worldId);
    if (!w.ready) { UI.go('coming', {id:worldId}); return; }
    if (!State.stageAvailable(worldId, stageId)) {
      UI.toast('Antes toca el paso anterior. El orden es siempre el mismo.');
      return;
    }
    Sound.unlock();
    Sound.tap();
    if (stageId === 'discover') UI.go('discover', {worldId});
    else if (stageId === 'game1' || stageId === 'game2') {
      const type = w.games[stageId === 'game1' ? 0 : 1];
      UI.go(type, {worldId, stageId});
    } else if (stageId === 'guardian') UI.go('boss', {worldId});
    else if (stageId === 'why') UI.go('why', {worldId});
    else UI.go('reward', {worldId});
  },
  layoutMap() {
    const board = $('#mapBoard');
    if (!board) return;
    const width = board.clientWidth;
    if (!width) return;
    const compact = width < 560;
    const cols = compact ? 2 : width < 960 ? 3 : 4;
    const rows = Math.ceil(WORLDS.length / cols);
    const pad = compact ? 64 : width < 960 ? 70 : 76;
    const cellW = (width - pad * 2) / Math.max(1, cols - 1);
    const cellH = compact ? 128 : width < 960 ? 136 : 146;
    const startY = 42;
    const height = startY + (rows - 1) * cellH + 136;
    board.style.height = height + 'px';
    const nodes = $$('.map-node', board);
    const pts = [];
    nodes.forEach((node, i) => {
      const row = Math.floor(i / cols);
      const col = row % 2 ? cols - 1 - (i % cols) : i % cols;
      const x = pad + col * cellW;
      const y = startY + row * cellH;
      node.style.left = x + 'px';
      node.style.top = y + 'px';
      pts.push([x, y + 40]);
    });
    const svg = $('#mapSvg');
    if (svg) {
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      const d = this.pathThrough(pts);
      const trail = $('#mapTrail');
      const done = $('#mapTrailDone');
      if (trail) trail.setAttribute('d', d);
      if (done) {
        let highest = 1;
        WORLDS.forEach(w => { if (State.anyDone(w.id)) highest = Math.max(highest, w.id); });
        const frac = clamp((highest - 1) / (WORLDS.length - 1), 0, 1) * 100;
        done.setAttribute('d', d);
        done.setAttribute('stroke-dasharray', `${frac.toFixed(1)} 100`);
      }
    }
  },
  pathThrough(points) {
    if (points.length < 2) return '';
    // Catmull-Rom convertido a Bézier: una serpiente suave que pasa por cada mundo.
    let d = `M ${points[0][0]} ${points[0][1]}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6;
      const c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6;
      const c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0]} ${p2[1]}`;
    }
    return d;
  },
  bindAdultGate(el) {
    let frame = null, start = 0, holding = false, finished = false;
    const stop = () => {
      holding = false;
      cancelAnimationFrame(frame);
      el.style.setProperty('--hold', 0);
    };
    const complete = () => {
      if (finished) return;
      finished = true;
      stop();
      Sound.unlock();
      Sound.star();
      UI.go('adult');
    };
    const tick = () => {
      if (!holding || finished) return;
      const pct = clamp((performance.now() - start) / 2000 * 100, 0, 100);
      el.style.setProperty('--hold', pct.toFixed(1));
      if (pct >= 100) { complete(); return; }
      frame = requestAnimationFrame(tick);
    };
    const begin = (e) => {
      if (e && e.type === 'pointerdown' && e.button !== 0) return;
      if (finished) return;
      e?.preventDefault();
      holding = true;
      start = performance.now();
      el.style.setProperty('--hold', 0);
      frame = requestAnimationFrame(tick);
    };
    el.addEventListener('pointerdown', begin);
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('contextmenu', e => e.preventDefault());
    el.addEventListener('keydown', (e) => {
      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) begin(e);
    });
    el.addEventListener('keyup', (e) => {
      if (e.key === ' ' || e.key === 'Enter') stop();
    });
  }
};

SCREENS.hub = () => ({html: Hub.screen(), after: () => Hub.after()});

const CREATOR_TABS = [
  {id:'face', label:'Rostro', icon:'user'},
  {id:'hair', label:'Pelo', icon:'sparkle'},
  {id:'eyes', label:'Ojos', icon:'eye'},
  {id:'mouth', label:'Boca', icon:'heart'},
  {id:'details', label:'Detalles', icon:'gem'}
];
const Creator = {
  state: null,
  tab: 'face',
  start() {
    this.state = randomAvatar();
    this.tab = 'face';
    this.renderTabs();
    this.renderPanel();
    this.renderPreview(false);
    this.bind();
  },
  name() {
    const value = ($('#kidName')?.value || '').trim();
    return value || 'Tu explorador';
  },
  bind() {
    const root = $('#creatorRoot');
    if (!root) return;
    root.addEventListener('click', (e) => {
      const tab = e.target.closest('[data-creator-tab]');
      if (tab) { this.switchTab(tab.dataset.creatorTab); return; }
      const look = e.target.closest('[data-look]');
      if (look) { this.setFeature(look.dataset.look, look.dataset.value); return; }
      const extra = e.target.closest('[data-extra]');
      if (extra) { this.toggleExtra(extra.dataset.extra); return; }
      if (e.target.closest('#creatorRandom')) { this.randomize(); return; }
    });
    $('#kidName')?.addEventListener('input', () => {
      const plate = $('#creatorNameplate');
      if (plate) plate.textContent = this.name();
      const svg = $('#creatorPreview svg');
      if (svg) svg.setAttribute('aria-label', `${this.name()}, ${avatarSummary(this.state)}`);
    });
  },
  switchTab(tab) {
    if (!CREATOR_TABS.some(t => t.id === tab)) return;
    this.tab = tab;
    this.renderTabs();
    this.renderPanel();
    document.querySelector(`[data-creator-tab="${tab}"]`)?.focus({preventScroll:true});
    Sound.pop(470 + CREATOR_TABS.findIndex(t => t.id === tab) * 34);
    this.announce(`Ahora eliges ${CREATOR_TABS.find(t => t.id === tab).label.toLowerCase()}.`);
  },
  renderTabs() {
    const box = $('#creatorTabs');
    if (!box) return;
    box.innerHTML = CREATOR_TABS.map(t => `<button class="creator-tab" type="button" data-creator-tab="${t.id}" aria-selected="${this.tab === t.id}">${I[t.icon]}<span>${t.label}</span></button>`).join('');
  },
  renderPanel() {
    const panel = $('#creatorPanel');
    if (!panel) return;
    panel.innerHTML = this.panelHTML();
  },
  renderPreview(animate = true) {
    const preview = $('#creatorPreview');
    if (!preview || !this.state) return;
    preview.innerHTML = avatarSVG(this.state, {hero:true, label:`${this.name()}, ${avatarSummary(this.state)}`});
    const plate = $('#creatorNameplate');
    if (plate) plate.textContent = this.name();
    if (animate) {
      preview.classList.remove('creator-pop');
      void preview.offsetWidth;
      preview.classList.add('creator-pop');
    }
  },
  announce(text) {
    const live = $('#creatorLive');
    if (live) live.textContent = text;
  },
  setFeature(kind, value) {
    if (!avatarOption(kind, value)) return;
    this.state[kind] = value;
    this.renderPanel();
    document.querySelector(`[data-look="${kind}"][data-value="${value}"]`)?.focus({preventScroll:true});
    this.renderPreview();
    Sound.pop(540 + (value.length * 17));
    this.announce(`${avatarLabel(kind, value)} seleccionado.`);
  },
  toggleExtra(key) {
    if (!['glasses', 'freckles', 'blush'].includes(key)) return;
    this.state[key] = !this.state[key];
    this.renderPanel();
    document.querySelector(`[data-extra="${key}"]`)?.focus({preventScroll:true});
    this.renderPreview();
    Sound.pop(this.state[key] ? 700 : 480);
    this.announce(`${key === 'glasses' ? 'Gafas' : key === 'freckles' ? 'Pecas' : 'Mejillas'} ${this.state[key] ? 'activadas' : 'desactivadas'}.`);
  },
  randomize() {
    this.state = randomAvatar();
    this.renderPanel();
    this.renderPreview();
    Sound.glock(720, .07);
    this.announce('Un aspecto nuevo. Puedes cambiar lo que quieras.');
  },
  groupHTML(kind, title, hint) {
    const options = AVATAR_OPTIONS[kind] || [];
    const colorGrid = ['skin', 'hairColor', 'eyeColor'].includes(kind);
    return `<section class="look-group">
      <div class="look-head"><h3>${title}</h3><p>${hint}</p></div>
      <div class="look-grid ${colorGrid ? 'look-grid--colors' : ''}">${options.map(opt => this.optionHTML(kind, opt, title)).join('')}</div>
    </section>`;
  },
  optionHTML(kind, opt, title) {
    const active = this.state[kind] === opt.id;
    const art = kind === 'top'
      ? `<span class="look-shirt" style="--shirt:${opt.color}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4 4 6 2 11l3.5 2.5L5 21h14l-.5-7.5L22 11l-2-5-4-2c-1 2-2.5 3-4 3s-3-1-4-3Z"/></svg></span>`
      : avatarSVG({...this.state, [kind]:opt.id}, {thumb:true, decorative:true});
    return `<button class="look-tile ${active ? 'is-active' : ''}" type="button" data-look="${kind}" data-value="${opt.id}" aria-pressed="${active}" aria-label="${title}: ${opt.label}">
      <span class="look-art">${art}</span><span class="look-name">${opt.label}</span>
    </button>`;
  },
  extrasHTML() {
    const items = [
      {key:'glasses', label:'Gafas', desc:'Marco redondo', icon:I.eye},
      {key:'freckles', label:'Pecas', desc:'Pequeños lunares', icon:I.sparkle},
      {key:'blush', label:'Mejillas', desc:'Un rubor suave', icon:I.heart}
    ];
    return `<section class="look-group">
      <div class="look-head"><h3>Detalles</h3><p>Pequeños toques que hacen único su rostro.</p></div>
      <div class="look-toggles">${items.map(item => `<button class="look-toggle ${this.state[item.key] ? 'is-active' : ''}" type="button" data-extra="${item.key}" aria-pressed="${this.state[item.key]}"><span class="look-extra-icon">${item.icon}</span><span><strong>${item.label}</strong><small>${item.desc}</small></span><span class="mini-switch" aria-hidden="true"></span></button>`).join('')}</div>
    </section>`;
  },
  panelHTML() {
    if (this.tab === 'face') return this.groupHTML('skin', 'Tono de piel', 'Elige el que más te guste.') + this.groupHTML('face', 'Forma de la cara', 'Redonda, ovalada, cuadrada o con mentón de corazón.');
    if (this.tab === 'hair') return this.groupHTML('hair', 'Peinado', 'Un mechón, rizos, moños… lo que pida la aventura.') + this.groupHTML('hairColor', 'Color de pelo', 'Natural o de otro mundo.');
    if (this.tab === 'eyes') return this.groupHTML('eyes', 'Mirada', 'Cómo mira al mundo.') + this.groupHTML('eyeColor', 'Color de ojos', 'Un brillo distinto.') + this.groupHTML('brows', 'Cejas', 'Su expresión también cuenta.');
    if (this.tab === 'mouth') return this.groupHTML('mouth', 'Boca', 'Una sonrisa para cada historia.') + this.groupHTML('nose', 'Nariz', 'El detalle que completa la cara.');
    return this.groupHTML('top', 'Color de aventura', 'El color de su ropa de explorador.') + this.extrasHTML();
  }
};

SCREENS.world = ({id}) => {
  const world = worldById(id);
  if (!world.ready) return SCREENS.coming({id});
  if (!State.unlocked(id)) {
    return {html:`<section class="screen"><div class="container center-col"><div class="panel pad center">
      <p class="kicker">Mundo ${id}</p><h1>Aún sin abrir</h1>
      <p class="lead">Completa una actividad del Mundo ${id - 1} y este camino florecerá. Sin prisa.</p>
      <button class="btn btn-primary" data-map>${I.left} Volver al mapa</button>
    </div></div></section>`, after:()=>{ $('[data-map]')?.addEventListener('click',()=>UI.go('hub')); }};
  }
  const wp = State.worldProgress(id);
  const totalStars = State.worldStars(id);
  const next = State.nextStage(id);
  const nextInfo = next ? stageTitle(world, next) : null;
  const creature = creatureById(world.creature);
  const stages = STAGE_ORDER.map((sid, idx) => {
    const info = stageTitle(world, sid);
    const s = State.stage(id, sid);
    const available = State.stageAvailable(id, sid);
    const isNext = next === sid;
    const done = s.done;
    const stars = sid === 'reward' ? (done ? 3 : 0) : s.stars;
    const side = done
      ? `<span class="stage-side">${sid === 'reward' ? `<span class="chip chip-green">${I.check} En el álbum</span>` : UI.starRow(stars)}<button class="btn btn-ghost btn-small stage-go" data-start="${sid}">${sid === 'reward' ? 'Ver' : 'Repetir'}</button></span>`
      : isNext && available
        ? `<span class="stage-side"><button class="btn btn-primary btn-small stage-go" data-start="${sid}">Empezar ${I.right}</button></span>`
        : `<span class="stage-lock">${I.lock} ${next ? 'Después' : ''}</span>`;
    return `<li class="stage-item ${done ? 'done' : ''} ${isNext ? 'next' : ''} ${!available && !done ? 'future' : ''}">
      <span class="stage-index" aria-hidden="true">${done ? I.check : idx + 1}</span>
      <span class="stage-copy"><strong>${esc(info.title)}</strong><span>${esc(info.sub)}</span></span>
      ${side}
    </li>`;
  }).join('');
  return {
    html:`<section class="screen"><div class="container">
      <div class="row" style="margin-bottom:14px"><button class="btn btn-ghost btn-small" type="button" data-map>${I.left} Mapa</button><span class="chip">${I.star} ${totalStars} / 15 estrellas</span></div>

/* ============================================================
   5. ARRASTRE, BALANZA Y BARRAS
   ============================================================ */
const Activities = {
  current: null,
  timers: [],
  rafs: [],
  later(fn, ms) {
    const id = setTimeout(() => { this.timers = this.timers.filter(t => t !== id); try { fn(); } catch (e) { console.error(e); } }, ms);
    this.timers.push(id);
    return id;
  },
  frame(fn) {
    const id = requestAnimationFrame(t => { this.rafs = this.rafs.filter(r => r !== id); fn(t); });
    this.rafs.push(id);
    return id;
  },
  destroy() {
    this.timers.forEach(clearTimeout);
    this.rafs.forEach(cancelAnimationFrame);
    this.timers = []; this.rafs = [];
    Drag.clear();
    if (this.current?.cleanup) {
      try { this.current.cleanup(); } catch (e) {}
    }
    this.current = null;
  }
};

/* Arrastre unificado con Pointer Events y alternativa de toque/teclado.
   El imán se activa a menos de 40 px del borde de una bandeja. */
const Drag = {
  ghosts: [],
  clear() {
    this.ghosts.forEach(g => g.remove());
    this.ghosts = [];
  },
  nearZone(x, y, zones) {
    let best = null, bestDist = Infinity;
    zones.forEach(z => {
      const r = z.getBoundingClientRect();
      const inX = x >= r.left - 40 && x <= r.right + 40;
      const inY = y >= r.top - 40 && y <= r.bottom + 40;
      if (!inX || !inY) return;
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const d = Math.hypot(x - cx, y - cy);
      if (d < bestDist) { bestDist = d; best = z; }
    });
    return best;
  },
  bind(el, opts) {
    if (el.dataset.dragBound === '1') return;
    el.dataset.dragBound = '1';
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || el.disabled || opts.disabled?.()) return;
      const startX = e.clientX, startY = e.clientY;
      const rect = el.getBoundingClientRect();
      let ghost = null, moved = false, hover = null;
      const zones = () => (typeof opts.zones === 'function' ? Array.from(opts.zones()) : []);
      const onMove = (ev) => {
        if (!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) > 7) {
          moved = true;
          ghost = el.cloneNode(true);
          ghost.classList.add('drag-ghost');
          ghost.removeAttribute('data-drag-bound');
          ghost.style.width = rect.width + 'px';
          ghost.style.height = rect.height + 'px';
          ghost.style.left = rect.left + 'px';
          ghost.style.top = rect.top + 'px';
          ghost.style.margin = '0';
          ghost.style.transform = 'rotate(-2deg) scale(1.04)';
          document.body.appendChild(ghost);
          Drag.ghosts.push(ghost);
          el.style.opacity = '.28';
          Sound.whoosh();
        }
        if (!ghost) return;
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        ghost.style.left = rect.left + dx + 'px';
        ghost.style.top = rect.top + dy + 'px';
        const z = Drag.nearZone(ev.clientX, ev.clientY, zones());
        if (hover !== z) {
          hover?.classList.remove('target');
          z?.classList.add('target');
          hover = z;
          if (z) ghost.classList.add('magnet'); else ghost.classList.remove('magnet');
        }
        ev.preventDefault();
      };
      const onUp = (ev) => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        el.style.opacity = '';
        const zonesNow = zones();
        const zone = Drag.nearZone(ev.clientX, ev.clientY, zonesNow);
        zonesNow.forEach(z => z.classList.remove('target'));
        if (!moved) {
          if (ghost) ghost.remove();
          return;
        }
        el.dataset.dragged = '1';
        setTimeout(() => { delete el.dataset.dragged; }, 180);
        if (ghost) ghost.classList.remove('magnet');
        if (zone) {
          if (ghost) {
            const r = zone.getBoundingClientRect();
            ghost.classList.add('return');
            ghost.style.left = (r.left + r.width / 2 - rect.width / 2) + 'px';
            ghost.style.top = (r.top + r.height / 2 - rect.height / 2) + 'px';
            ghost.style.transform = 'scale(.7) rotate(4deg)';
            ghost.style.opacity = '0';
            setTimeout(() => ghost.remove(), 380);
          }
          Sound.pop(600);
          opts.onDrop(zone.dataset.side || zone.dataset.drop || 'drop');
        } else if (ghost) {
          ghost.classList.add('return');
          ghost.style.left = rect.left + 'px';
          ghost.style.top = rect.top + 'px';
          ghost.style.transform = 'none';
          setTimeout(() => ghost.remove(), 430);
          Sound.neutral();
        }
      };
      window.addEventListener('pointermove', onMove, {passive:false});
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }
};

function activityHeader({world, stageName, title, instruction, step, total, body}) {
  return `<div class="activity-head">
    <button class="icon-btn" type="button" data-back aria-label="Volver al mundo">${I.left}</button>
    <div class="activity-heading">
      <p class="kicker">Mundo ${world.id} · ${esc(stageName)}</p>
      <h1>${esc(title)}</h1>
    </div>
    <div class="activity-tools">
      <button class="tool-btn" type="button" data-hint aria-label="Ver una pista">${I.bulb}<span>Pista</span></button>
      <button class="tool-btn" type="button" data-speak aria-label="Leer la instrucción en voz alta">${I.speaker}<span class="hide-sm">Leer</span></button>
    </div>
  </div>
  ${UI.progressDots(step, total, `${step + 1} de ${total}`)}
  <div class="instruction-row"><p class="instruction hand" id="instruction">${esc(instruction)}</p></div>
  ${body}`;
}

function speechFor(root) {
  return $('#instruction', root)?.textContent?.trim() || '';
}

const Discover = {
  world: null, worldId: 0, expIdx: 0, cfg: null, pool: [], left: [], right: [],
  moves: 0, errors: 0, totalMoves: 0, totalPar: 0, pending: null,
  selectedId: null, power: null, groupSel: [], hintText: '', solved: false,
  tilt: 0, binded: false,

  start(worldId) {
    this.worldId = Number(worldId);
    this.world = worldById(worldId);
    this.expIdx = 0; this.totalMoves = 0; this.totalPar = 0; this.solved = false;
    this.binded = false;
    this.setup();
    Activities.current = this;
    return this.template();
  },
  setup() {
    const cfgs = DISCOVER[this.worldId] || DISCOVER[1];
    this.cfg = cfgs[this.expIdx];
    this.pool = this.cfg.cards.map((v, i) => ({id:`c${this.expIdx}_${i}`, v}));
    this.left = []; this.right = []; this.moves = 0; this.errors = 0;
    this.pending = null; this.selectedId = null; this.power = null; this.groupSel = [];
    this.hintText = ''; this.solved = false; this.tilt = 0;
  },
  sum(arr) { return arr.reduce((n, c) => n + c.v, 0); },
  target() { return this.cfg.target; },
  currentTilt() {
    if (this.cfg.mode === 'pair') return 0;
    const diff = this.sum(this.right) - this.cfg.target;
    return clamp(diff / Math.max(1, this.cfg.target) * 8, -9, 9);
  },
  boxAmount() {
    return `<div class="box-amount">${amountMarkup(this.cfg.target, this.cfg.style)}</div><span class="box-label">${this.cfg.style === 'digits' ? esc(String(this.cfg.target)) : 'caja'}</span>`;
  },
  starBox(open = false, glow = false) {
    return `<div class="star-box ${open ? 'open' : ''} ${glow ? 'glow' : ''}" role="img" aria-label="Caja estrella que pesa ${this.cfg.target}">
      <span class="box-glow"></span>
      <span class="box-lid">${I.star}</span>
      <div class="box-body">${this.boxAmount()}</div>
    </div>`;
  },
  trayCards(arr, side) {
    return arr.map(c => `<button class="tray-card" type="button" data-remove="${c.id}" aria-label="Quitar carta de ${c.v} de la bandeja ${side === 'left' ? 'izquierda' : 'derecha'}">${c.v}<small>${c.v >= 10 && c.v % 10 === 0 ? (c.v / 10) + '×10' : 'peso'}</small></button>`).join('');
  },
  pairGhost(side) {
    if (!this.pending || this.pending.waitSide !== side) return '';
    return `<span class="pair-ghost" aria-hidden="true">${side === 'left' ? '←' : '→'} ${this.pending.v}</span>`;
  },
  powerButtons() {
    const all = [
      {id:'duplicate', label:'Duplicar', icon:'copy'},
      {id:'group', label:'Agrupar', icon:'group'},
      {id:'split', label:'Descomponer', icon:'split'}
    ];
    if (!this.cfg.powers?.length) return '';
    return `<div class="powers" role="group" aria-label="Poderes del descubrimiento">
      ${all.map(p => this.cfg.powers.includes(p.id) ? `<button class="power-btn" type="button" data-power="${p.id}" aria-pressed="${this.power === p.id ? 'true' : 'false'}">${I[p.icon]}${p.label}</button>` : '').join('')}
      <p class="power-note">${this.power === 'duplicate' ? 'Toca una carta de la mesa para hacer una copia.' : this.power === 'group' ? 'Toca dos cartas de la mesa para unirlas en una.' : this.power === 'split' ? 'Toca una carta de la mesa para partirla en dos.' : 'Los poderes son ayudas: no cuestan estrellas.'}</p>
    </div>`;
  },
  template() {
    const pair = this.cfg.mode === 'pair';
    const rightTotal = this.sum(this.right);
    const leftTotal = this.sum(this.left);
    const tilt = this.tilt;
    const target = this.cfg.target;
    const available = this.cfg.powers || [];
    const cards = this.pool.map(c => {
      const selected = this.selectedId === c.id || this.groupSel.includes(c.id);
      return `<button class="card ${selected ? 'selected' : ''}" type="button" data-card="${c.id}" aria-pressed="${selected}" aria-label="Carta que pesa ${c.v}${pair && this.selectedId === c.id ? '. Elige una bandeja' : ''}">${cardVisual(c.v, this.cfg.style)}<span class="card-tag">${cardTag(c.v, this.cfg.style)}</span></button>`;
    }).join('');
    const leftContent = pair ? this.trayCards(this.left, 'left') + this.pairGhost('left') : this.starBox(this.solved, this.solved);
    const rightContent = this.trayCards(this.right, 'right') + this.pairGhost('right');
    const showLeftBtn = pair && this.selectedId && !this.pending;
    const waitBtn = pair && this.pending && this.pending.waitSide === 'left';
    const showRightBtn = pair && this.selectedId && !this.pending;
    const body = `
      <div class="workspace split">
        <div class="balance-card">
          <div class="balance-hint" aria-hidden="true">${I.star} ${pair ? 'Cada lado: ' + target : 'Caja: ' + target} · ${pair ? `Izq ${leftTotal} / Der ${rightTotal}` : `Bandeja: ${rightTotal}`}</div>
          <div class="balance-scene">
            <div class="balance-sky"></div><div class="balance-ground"></div>
            ${pair ? `<div class="balance-center-box">${this.starBox(this.solved, this.solved)}</div>` : ''}
            <div class="balance-beam-wrap">
              <div class="balance-beam" style="--tilt:${tilt}deg">
                <div class="balance-pan left">
                  <div class="balance-rope"></div>
                  <div class="balance-tray ${this.solved && !pair ? 'target' : ''}" data-side="left">
                    ${leftContent || '<span class="tray-empty">Caja</span>'}
                  </div>
                  ${showLeftBtn || waitBtn ? `<button class="btn btn-soft tray-drop-btn" type="button" data-place="left">Poner aquí</button>` : ''}
                </div>
                <div class="balance-pan right">
                  <div class="balance-rope"></div>
                  <div class="balance-tray ${pair ? '' : 'target'}" data-side="right">
                    ${rightContent || `<span class="tray-empty">${pair ? 'Bandeja derecha' : 'Pon cartas aquí'}</span>`}
                  </div>
                  ${showRightBtn || (pair && this.pending && this.pending.waitSide === 'right') ? `<button class="btn btn-soft tray-drop-btn" type="button" data-place="right">Poner aquí</button>` : ''}
                </div>
              </div>
            </div>
            <div class="balance-post"></div><div class="balance-knob"></div><div class="balance-base"></div>
          </div>
        </div>
        <aside class="discover-panel">
          <div class="mesa-label"><span>Mesa de cartas</span><span class="chip ${this.solved ? 'chip-green' : ''}">${this.solved ? I.check + ' Equilibrado' : pair ? 'Parejas' : 'Mismo peso'}</span></div>
          <div class="card-pool">${cards || '<span class="tiny muted">La mesa está vacía. Reinicia el experimento.</span>'}</div>
          ${this.powerButtons()}
          ${pair ? `<div class="rule-chip">${I.balance} Equilibrio: cada carta necesita su pareja</div>` : ''}
          ${this.hintText ? `<div class="hint-panel" role="status">${I.bulb}<p>${this.hintText}</p></div>` : ''}
          ${this.solved ? `<div class="panel-soft pad" style="text-align:center"><div class="row" style="justify-content:center">${I.check}<strong>${pair ? 'Dos lados iguales' : 'La caja está en calma'}</strong></div><p class="tiny" style="margin:5px 0 10px">${pair ? 'Habéis puesto el mismo peso a cada lado.' : `La bandeja suma ${target}.`}</p><button class="btn btn-primary" type="button" data-next-exp>${this.expIdx < 2 ? 'Siguiente experimento' : 'Terminar'} ${I.right}</button></div>` : ''}
          ${!this.solved ? `<div class="row" style="justify-content:space-between"><button class="link-btn" type="button" data-reset-exp>Reiniciar experimento</button><span class="tiny muted">${available.length ? 'Puedes usar los poderes.' : 'Sin prisa.'}</span></div>` : ''}
        </aside>
      </div>`;
    return `<div class="activity">${activityHeader({
      world: this.world,
      stageName: 'Descubrir',
      title: pair ? 'Igual peso a los dos lados' : 'Equilibra la balanza',
      instruction: pair ? 'Cada carta necesita su pareja en el otro lado.' : 'Pon en la bandeja el mismo peso que la caja.',
      step: this.expIdx, total: 3, body
    })}</div>`;
  },
  paint(animateTilt = false) {
    const root = $('#activityRoot');
    if (!root) return;
    const old = this.tilt;
    const next = this.currentTilt();
    this.tilt = next;
    root.innerHTML = this.template();
    this.bindDrag();
    const beam = $('.balance-beam', root);
    if (beam && animateTilt) {
      beam.style.setProperty('--tilt', old + 'deg');
      requestAnimationFrame(() => beam.style.setProperty('--tilt', next + 'deg'));
    }
  },
  after() {
    const root = $('#activityRoot');
    if (!root) return;
    if (!this.binded) {
      this.binded = true;
      root.addEventListener('click', (e) => {
        if (e.target.closest('[data-back]')) { Sound.whoosh(); UI.go('world', {id:this.worldId}); return; }
        if (e.target.closest('[data-speak]')) { Sound.tap(); Voice.say(speechFor(root), true); return; }
        if (e.target.closest('[data-hint]')) { Sound.tap(); this.showHint(); return; }
        if (e.target.closest('[data-reset-exp]')) { Sound.whoosh(); this.setup(); this.paint(); return; }
        if (e.target.closest('[data-next-exp]')) { Sound.glock(523.25, .06); this.nextExp(); return; }
        const power = e.target.closest('[data-power]');
        if (power) { Sound.tap(); this.togglePower(power.dataset.power); return; }
        const place = e.target.closest('[data-place]');
        if (place) { this.placeSelected(place.dataset.place); return; }
        const remove = e.target.closest('[data-remove]');
        if (remove) { this.removeCard(remove.dataset.remove); return; }
        const card = e.target.closest('[data-card]');
        if (card) {
          if (card.dataset.dragged === '1') return;
          this.tapCard(card.dataset.card);
        }
      });
    }
    this.paint();
    this.bindDrag();
  },
  bindDrag() {
    if (this.solved) return;
    const sides = $$('.balance-tray[data-side]');
    $$('.card-pool .card[data-card]').forEach(el => {
      Drag.bind(el, {
        zones: () => sides,
        disabled: () => this.solved || !!this.power,
        onDrop: (side) => {
          const id = el.dataset.card;
          const targetSide = this.cfg.mode === 'pair' ? side : 'right';
          this.placeCard(id, targetSide, true);
        }
      });
    });
  },
  tapCard(id) {
    const card = this.pool.find(c => c.id === id);
    if (!card || this.solved) return;
    Sound.pop(620);
    if (this.power === 'duplicate') {
      this.pool.push({id:'d' + uid() + '_' + this.expIdx, v: card.v});
      this.power = null;
      this.hintText = 'Ahora hay dos cartas iguales.';
      this.paint();
      return;
    }
    if (this.power === 'split') {
      if (card.v < 2) { this.hintText = 'Esta carta ya es una unidad: no se puede partir más.'; this.paint(); return; }
      const a = card.v >= 10 ? Math.floor(card.v / 2) : card.v - 1;
      const b = card.v - a;
      this.pool = this.pool.filter(c => c.id !== id);
      this.pool.push({id:'s' + uid(), v:a}, {id:'s' + uid(), v:b});
      this.power = null;
      this.hintText = `${card.v} se ha partido en ${a} + ${b}.`;
      Sound.merge();
      this.paint();
      return;
    }
    if (this.power === 'group') {
      if (this.groupSel.includes(id)) this.groupSel = this.groupSel.filter(x => x !== id);
      else this.groupSel.push(id);
      if (this.groupSel.length === 2) {
        const cards = this.pool.filter(c => this.groupSel.includes(c.id));
        const total = cards.reduce((n, c) => n + c.v, 0);
        this.pool = this.pool.filter(c => !this.groupSel.includes(c.id));
        this.pool.push({id:'g' + uid(), v:total});
        this.groupSel = [];
        this.power = null;
        this.hintText = `Dos cartas se han unido en una de ${total}.`;
        Sound.merge();
      }
      this.paint();
      return;
    }
    if (this.cfg.mode === 'pair') {
      if (this.pending) {
        this.placeCard(id, this.pending.waitSide, true);
      } else {
        this.selectedId = id;
        this.hintText = '';
        this.paint();
      }
    } else {
      this.placeCard(id, 'right', true);
    }
  },
  placeSelected(side) {
    if (!this.selectedId) return;
    this.placeCard(this.selectedId, side, true);
  },
  placeCard(id, side, userAction) {
    const card = this.pool.find(c => c.id === id);
    if (!card || this.solved) return;
    const pair = this.cfg.mode === 'pair';
    if (!pair) {
      const total = this.sum(this.right) + card.v;
      if (total > this.cfg.target) {
        this.fail(`Esa carta pasa del peso. Necesitas ${this.cfg.target - this.sum(this.right)} más, no ${card.v}.`);
        return;
      }
      this.pool = this.pool.filter(c => c.id !== id);
      this.right.push(card);
      this.moves++;
      this.selectedId = null;
      Sound.pop(660);
      if (total === this.cfg.target) this.solve();
      else { this.hintText = ''; this.paint(true); }
      return;
    }
    // Modo parejas: el fiel solo se equilibra cuando cada carta tiene su igual al otro lado.
    if (this.pending) {
      if (side !== this.pending.waitSide) {
        this.fail(`Esta carta espera su pareja en la bandeja ${this.pending.waitSide === 'left' ? 'izquierda' : 'derecha'}.`);
        return;
      }
      if (card.v !== this.pending.v) {
        this.fail(`La pareja que falta vale ${this.pending.v}. Busca una carta de ${this.pending.v}.`);
        return;
      }
      const total = this.sum(this.pending.waitSide === 'left' ? this.left : this.right);
      if (total + card.v > this.cfg.target) {
        this.fail(`Ese lado pasaría de ${this.cfg.target}. Prueba otra pareja.`);
        return;
      }
      this.pool = this.pool.filter(c => c.id !== id);
      (side === 'left' ? this.left : this.right).push(card);
      this.pending = null;
      this.moves++;
      Sound.pop(720);
      if (this.sum(this.left) === this.cfg.target && this.sum(this.right) === this.cfg.target) this.solve();
      else { this.hintText = ''; this.paint(); }
      return;
    }
    if (side === 'left') {
      if (this.sum(this.left) + card.v > this.cfg.target) { this.fail('Ese lado pasaría del peso de la caja. Prueba una carta más pequeña.'); return; }
    } else if (this.sum(this.right) + card.v > this.cfg.target) {
      this.fail('Ese lado pasaría del peso de la caja. Prueba una carta más pequeña.'); return;
    }
    this.pool = this.pool.filter(c => c.id !== id);
    (side === 'left' ? this.left : this.right).push(card);
    this.moves++;
    this.selectedId = null;
    this.pending = {v:card.v, waitSide: side === 'left' ? 'right' : 'left'};
    this.hintText = `Ahora pon otra carta de ${card.v} en la bandeja ${this.pending.waitSide === 'left' ? 'izquierda' : 'derecha'}. El fiel espera.`;
    Sound.pop(600);
    this.paint();
    if (!this.pending) return;
  },
  removeCard(id) {
    const pair = this.cfg.mode === 'pair';
    if (pair) return; // en parejas se reinicia para no romper la igualdad
    const idx = this.right.findIndex(c => c.id === id);
    if (idx >= 0) {
      const [card] = this.right.splice(idx, 1);
      this.pool.push(card);
      Sound.pop(440);
      this.hintText = '';
      this.paint(true);
    }
  },
  fail(msg) {
    this.errors++;
    this.hintText = msg;
    this.solved = false;
    Sound.neutral();
    const tray = $('.balance-tray');
    tray?.classList.add('blocked');
    this.paint();
  },
  solve() {
    this.solved = true;
    this.pending = null;
    this.selectedId = null;
    this.hintText = '';
    this.totalMoves += this.moves;
    this.totalPar += this.cfg.par;
    this.tilt = 0;
    Sound.success();
    const card = $('.balance-card');
    if (card) {
      const r = card.getBoundingClientRect();
      setTimeout(() => Particles.burst(r.left + r.width / 2, r.top + 100, {count:24, spread:3}), 80);
    }
    this.paint();
    announce('Balanza equilibrada. Muy bien.');
  },
  showHint() {
    const pair = this.cfg.mode === 'pair';
    if (this.solved) {
      this.hintText = this.expIdx < 2 ? 'Puedes pasar al siguiente experimento.' : 'Has terminado los tres experimentos.';
      this.paint();
      return;
    }
    if (pair) {
      this.hintText = this.pending
        ? `Falta una carta de ${this.pending.v} en la bandeja ${this.pending.waitSide === 'left' ? 'izquierda' : 'derecha'}.`
        : `Elige una carta y colócala a un lado. Su pareja irá al otro lado, con el mismo valor. Cada lado debe llegar a ${this.cfg.target}.`;
    } else {
      const missing = this.cfg.target - this.sum(this.right);
      const best = this.pool.slice().sort((a, b) => b.v - a.v).find(c => c.v <= missing);
      this.hintText = missing > 0
        ? `Faltan ${missing} de peso. Prueba con una carta de ${best ? best.v : 'menos peso'}; también puedes duplicar o partir cartas.`
        : 'La bandeja ya pesa lo mismo que la caja.';
    }
    Sound.pop(500);
    this.paint();
  },
  nextExp() {
    if (this.expIdx < 2) {
      this.expIdx++;
      this.setup();
      this.paint();
      window.scrollTo({top:0, behavior: reducedNow() ? 'auto' : 'smooth'});
    } else {
      const stars = this.totalMoves <= this.totalPar ? 3 : this.totalMoves <= this.totalPar + 3 ? 2 : 1;
      UI.finishActivity({
        worldId:this.worldId, stageId:'discover', stars,
        title:'La caja respira',
        note:'Has encontrado el mismo peso de otra manera. Eso es comprender.',
        stats:[['Movimientos', this.totalMoves], ['Ideal', this.totalPar]],
        repeat:() => UI.go('discover', {worldId:this.worldId})
      });
    }
  },
  cleanup() {
    this.binded = false;
  }
};

function amountMarkup(v, style) {
  if (v > 12 || style === 'digits') {
    let html = `<div class="tenrods">`;
    const tens = Math.floor(v / 10);
    for (let i = 0; i < Math.min(tens, 6); i++) html += '<span class="tenn"></span>';
    html += '</div>';
    const rem = v % 10;
    for (let i = 0; i < rem; i++) html += '<span class="dot"></span>';
    return html;
  }
  let html = '';

    else if (this.selected.length < 2) this.selected.push(f);
    else this.selected = [f];
    this.hintText = '';
    Sound.pop(480 + f * 32);
    this.paint();
    this.startDrift();
  },
  applyDrift() {
    const speed = State.settings.targetSpeed || 0;
    const blocks = $$('.product-block');
    if (!blocks.length) return;
    this.blockEls = blocks;
    const t = performance.now();
    blocks.forEach((el, i) => {
      if (!speed) { el.style.transform = 'none'; return; }
      const amp = 2 + speed * 6;
      const x = Math.sin(t * .00022 * (0.6 + speed) + i * 1.7) * amp;
      const y = Math.cos(t * .00018 * (0.6 + speed) + i * 2.1) * amp * .5;
      el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
    });
  },
  startDrift() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    if (!this.alive) return;
    const speed = State.settings.targetSpeed || 0;
    const tick = () => {
      if (!this.alive) return;

  shoot(id) {

      const rack = $('.factor-rack');
      rack?.scrollIntoView({behavior: reducedNow() ? 'auto' : 'smooth', block:'nearest'});

    }
    const product = this.productOfPair();
    if (this.target && product !== this.target) {
      this.hintText = `Tu pareja da ${product}. Para llegar a ${this.target}, busca otra pareja.`;
      Sound.neutral();
      this.paint(); this.startDrift();
      return;
    }
    if (block.value !== product) {
      this.errors++;
      this.hintText = `Ese bloque vale ${block.value}. Tu pareja da ${product}. ${strategyLine(this.selected[0], this.selected[1])}`;
      Sound.neutral();
      block.hit = false;
      const el = $(`[data-block="${id}"]`);
      el?.classList.add('wrong');
      this.paint(); this.startDrift();
      const wrong = $(`[data-block="${id}"]`);
      wrong?.classList.add('wrong');
