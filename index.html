    }
    this.fireShot(id, block, product);
  },
  fireShot(id, block, product) {
    this.shooting = true;
    const bonusBlock = block;
    const el = $(`[data-block="${id}"]`);
    const scene = $('#targetScene');
    const star = document.createElement('span');
    star.className = 'shot-star';
    star.innerHTML = I.star;
    document.body.appendChild(star);
    const sceneRect = scene?.getBoundingClientRect();
    const from = {x: sceneRect ? sceneRect.left + sceneRect.width / 2 : window.innerWidth / 2, y: sceneRect ? sceneRect.bottom - 30 : window.innerHeight - 100};
    const toRect = el?.getBoundingClientRect();
    const to = {x: toRect ? toRect.left + toRect.width / 2 : from.x, y: toRect ? toRect.top + toRect.height / 2 : from.y - 100};
    const start = performance.now();
    const duration = reducedNow() ? 80 : 430;
    const step = (now) => {
      if (!this.alive) { star.remove(); return; }
      const p = clamp((now - start) / duration, 0, 1);
      const x = from.x + (to.x - from.x) * p;
      const arc = Math.sin(p * Math.PI) * 90;
      const y = from.y + (to.y - from.y) * p - arc;
      star.style.left = (x - 16) + 'px';
      star.style.top = (y - 16) + 'px';
      star.style.transform = `rotate(${p * 300}deg) scale(${1 - p * .35})`;
      if (p < 1) this.shotRaf = requestAnimationFrame(step);
      else {
        star.remove();
        bonusBlock.hit = true;
        if (el) el.classList.add('hit');
        Sound.success();
        const r = toRect;
        if (r && !lowNow()) Particles.burst(r.left + r.width / 2, r.top + r.height / 2, {count:20, spread:3});
        Adapt.record(this.selected[0], this.selected[1], true, this.hints ? 'pista' : 'directa', Date.now() - this.started);
        announce(`¡Producto ${product}!`);
        Activities.later(() => { this.shooting = false; this.nextRound(); }, reducedNow() ? 300 : 780);
      }
    };
    this.shotRaf = requestAnimationFrame(step);
  },
  showHint() {
    if (this.selected.length === 2) {
      const p = this.productOfPair();
      this.hintText = `${strategyLine(this.selected[0], this.selected[1])} Busca el bloque ${p}${this.target ? ` y recuerda que el objetivo es ${this.target}` : ''}.`;
    } else {
      this.hintText = this.target
        ? `Necesitas dos factores que multiplicados den ${this.target}. Prueba con ${this.plan.targetFactors[0]} × ${this.target / Math.max(1, this.plan.targetFactors[0])}.`

    }
    this.paint(); this.startDrift();
  },
  nextRound() {

      this.round++;
      this.setupRound();
      this.paint(); this.startDrift();
      window.scrollTo({top:0, behavior: reducedNow() ? 'auto' : 'smooth'});
    } else {
      const stars = this.errors === 0 ? 3 : this.errors <= 2 ? 2 : 1;
      UI.finishActivity({
        worldId:this.worldId, stageId:this.stageId, stars,
        title:'Cuatro estrellas en el blanco',
        note:'Has unido parejas de factores con su producto. Eso es fluidez tranquila.',
        stats:[['Despistes', this.errors], ['Pistas', this.hints]],
        repeat:() => UI.go('target', {worldId:this.worldId, stageId:this.stageId})
      });
    }
  },
  cleanup() {
    this.alive = false;
    this.binded = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.shotRaf) cancelAnimationFrame(this.shotRaf);
    this.raf = null; this.shotRaf = null;
    $$('.shot-star').forEach(s => s.remove());
  }
};
function strategyLine(a, b) {
  const small = Math.min(a, b), large = Math.max(a, b);
  if (small === 1) return `${a} × ${b} es el mismo número, ${a * b}.`;
  if (small === 10) return `${large} × 10 es ${large} con un cero: ${a * b}.`;
  const parts = Array.from({length:small}, () => large).join(' + ');
  return `${a} × ${b} = ${parts} = ${a * b}.`;
}

/* ---------- 6.2 El trazo que une ---------- */
const Connect = {
  worldId:0, world:null, stageId:'game2', board:0, pairs:[], cleared:[], history:[],
  selected:null, errors:0, hints:0, hintText:'', alive:false, binded:false,
  traceAbort:null, suppressClick:false, started:0,

  start(worldId, stageId = 'game2') {
    this.worldId = Number(worldId);
    this.world = worldById(worldId);
    this.stageId = stageId;
    this.board = 0; this.errors = 0; this.hints = 0;
    this.alive = true; this.binded = false; this.started = Date.now();
    this.setupBoard();
    Activities.current = this;
    return this.template();
  },
  setupBoard() {
    const base = this.world.tables[0] || 2;
    const sets = {
      1:[{a:2,b:2},{a:3,b:2},{a:4,b:2},{a:2,b:3},{a:3,b:3},{a:2,b:4}],
      2:[{a:2,b:2},{a:3,b:2},{a:4,b:2},{a:2,b:3},{a:2,b:4},{a:2,b:5}],
      3:[{a:2,b:10},{a:3,b:10},{a:4,b:10},{a:5,b:10},{a:2,b:5},{a:3,b:5}]
    };
    const all = sets[this.worldId] || sets[1];
    const chunk = all.slice(this.board * 3, this.board * 3 + 3).map((f, i) => ({
      ...f, p:f.a * f.b, id:'c' + this.board + '_' + i,
      key:normFact(f.a, f.b),
      fmt: ['num','dots','sum'][(i + this.board) % 3]
    }));
    this.pairs = chunk;
    this.cleared = []; this.history = []; this.selected = null; this.hintText = '';
    const ops = shuffleSeed(chunk.slice(), 5 + this.board * 7);
    const prods = shuffleSeed(chunk.slice(), 9 + this.board * 5);
    this.ops = ops; this.prods = prods;
  },
  opMarkup(pair) {
    if (pair.fmt === 'dots') {
      let groups = '';
      const groupsCount = Math.min(pair.a, 5);
      for (let i = 0; i < groupsCount; i++) {
        groups += `<span class="mini-dots">${Array.from({length:Math.min(pair.b, 10)}, () => '<span class="dot"></span>').join('')}</span>`;
      }
      return `${groups}<small>${groupsCount < pair.a ? '+ …' : 'grupos'} de ${pair.b}</small>`;
    }
    if (pair.fmt === 'sum') {
      const show = Math.min(pair.a, 3);
      const txt = Array.from({length:show}, () => pair.b).join(' + ') + (pair.a > show ? ' + …' : '');
      return `<span style="font-size:.9em">${txt}</span><small>suma repetida</small>`;
    }

  },
  template() {
    const ops = this.ops.map(p => {
      const isCleared = this.cleared.includes(p.id);
      const selected = this.selected?.id === p.id;
      return `<button class="connect-card ${selected ? 'selected' : ''} ${isCleared ? 'cleared' : ''}" type="button" data-op="${p.id}" aria-label="${isCleared ? 'Operación resuelta' : `${pairText(p)}. Une con su resultado.`}">${isCleared ? '' : this.opMarkup(p)}</button>`;
    }).join('');
    const prods = this.prods.map(p => {
      const isCleared = this.cleared.includes(p.id);
      return `<button class="connect-card ${isCleared ? 'cleared' : ''}" type="button" data-prod="${p.id}" aria-label="${isCleared ? 'Resultado resuelto' : `Resultado ${p.p}. Une con su operación.`}">${isCleared ? '' : p.p}<small>${isCleared ? '' : 'producto'}</small></button>`;
    }).join('');
    const cleared = this.cleared.length / 2;
    const boardDone = cleared === 3;
    const body = `
      <div class="connect-layout">
        <div class="connect-board" id="connectBoard" style="--accent-soft:${this.world.soft}">
          <svg class="connect-svg" id="connectSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path id="tracePath" d=""></path></svg>
          <div class="connect-col" aria-label="Operaciones">${ops}</div>
          <div class="connect-col" aria-label="Resultados">${prods}</div>
          <span class="connect-note">Arrastra de una cuenta a su resultado · o toca una y luego la otra</span>
        </div>
        <div class="connect-toolbar">
          <span class="chip ${boardDone ? 'chip-green' : ''}">${cleared} de 3 parejas · tablero ${this.board + 1} de 2</span>
          <div class="row" style="gap:7px">

            <button class="btn btn-ghost btn-small" type="button" data-reset-board>Reiniciar tablero</button>
            ${boardDone ? `<button class="btn btn-primary btn-small" type="button" data-next-board>${this.board < 1 ? 'Siguiente tablero' : 'Terminar'} ${I.right}</button>` : ''}
          </div>
        </div>

      </div>`;
    return `<div class="activity">${activityHeader({
      world:this.world, stageName:stageTitle(this.world, this.stageId).title,
      title:'El trazo que une', instruction:'Une cada operación con su producto sin levantar el dedo. También puedes tocar una y luego la otra.',
      step:this.board, total:2, body

  },
  paint() {
    const root = $('#activityRoot');

  after() {
    const root = $('#activityRoot');

      this.binded = true;
      root.addEventListener('click', (e) => {
        if (this.suppressClick) { this.suppressClick = false; return; }
        if (e.target.closest('[data-back]')) { Sound.whoosh(); UI.go('world', {id:this.worldId}); return; }
        if (e.target.closest('[data-speak]')) { Sound.tap(); Voice.say(speechFor(root), true); return; }
        if (e.target.closest('[data-hint]')) { Sound.tap(); this.hints++; this.showHint(); return; }
        if (e.target.closest('[data-undo]')) { this.undo(); return; }
        if (e.target.closest('[data-reset-board]')) { this.setupBoard(); this.paint(); return; }
        if (e.target.closest('[data-next-board]')) { this.nextBoard(); return; }
        const op = e.target.closest('[data-op]');
        if (op) { this.selectOp(op.dataset.op); return; }
        const prod = e.target.closest('[data-prod]');
        if (prod) { this.tryConnect(prod.dataset.prod); return; }

    }

    this.bindTrace();
  },
  setupSvg() {
    const board = $('#connectBoard');
    const svg = $('#connectSvg');
    if (!board || !svg) return;

  },
  centerOf(el) {
    const b = $('#connectBoard').getBoundingClientRect();
    const r = el.getBoundingClientRect();

  },
  drawPath(from, to, colorGreen = false) {
    const path = $('#tracePath');

    path.setAttribute('d', d);

  },
  bindTrace() {
    if (this.traceAbort) this.traceAbort.abort();

    const signal = this.traceAbort.signal;
    const board = $('#connectBoard');
    if (!board) return;
    board.addEventListener('pointerdown', (e) => {
      const opEl = e.target.closest('[data-op]');
      if (!opEl || opEl.classList.contains('cleared')) return;
      const op = this.pairs.find(p => p.id === opEl.dataset.op);
      if (!op) return;
      const start = this.centerOf(opEl);
      const startX = e.clientX, startY = e.clientY;
      let moved = false;
      this.drawPath(start, start);
      const move = (ev) => {
        if (!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) {
          moved = true;
          this.selected = op;
          $$('.connect-card').forEach(c => c.classList.remove('selected'));
          opEl.classList.add('selected');
        }
        const b = board.getBoundingClientRect();
        const to = {x: ev.clientX - b.left, y: ev.clientY - b.top};
        const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-prod]');
        $$('.connect-card').forEach(c => c.classList.remove('target'));
        if (target) {
          target.classList.add('target');
          const t = this.centerOf(target);
          this.drawPath(start, t);
        } else {
          this.drawPath(start, to);
        }
        ev.preventDefault();
      };
      const up = (ev) => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-prod]');
        $$('.connect-card').forEach(c => c.classList.remove('target'));
        if (moved) {
          this.suppressClick = true;
          setTimeout(() => { this.suppressClick = false; }, 100);
          if (target) this.tryConnect(target.dataset.prod, true);
          else {
            $('#tracePath')?.setAttribute('d', '');

          }
        } else {
          $('#tracePath')?.setAttribute('d', '');
        }

      window.addEventListener('pointermove', move, {passive:false});
      window.addEventListener('pointerup', up);
    }, {signal});

      }, {signal});
    }

  selectOp(id) {
    const op = this.pairs.find(p => p.id === id);
    if (!op) return;
    if (this.cleared.includes(id)) return;
    if (this.selected?.id === id) {
      this.selected = null;
      $('#tracePath')?.setAttribute('d', '');
      Sound.pop(420);
      this.paint(); this.bindTrace();
      return;
    }
    this.selected = op;
    Sound.pop(540);
    this.paint(); this.bindTrace();
    const opEl = $(`[data-op="${id}"]`);
    const path = $('#tracePath');
    if (opEl && path) {

  },
  tryConnect(prodId, fromDrag = false) {

        this.paint(); this.bindTrace();

      return;
    }
    const op = this.selected;
    if (this.cleared.includes(prodId)) return;
    if (op.id === prod.id) {
      this.goodConnect(op, prod);
    } else {
      this.errors++;
      this.hintText = `${pairText(op)} = ${op.p}. Ese resultado es ${prod.p}. ${strategyLine(op.a, op.b)}`;
      Sound.neutral();
      const prodEl = $(`[data-prod="${prodId}"]`);
      prodEl?.classList.add('wrong');
      const opEl = $(`[data-op="${op.id}"]`);
      opEl?.classList.add('wrong');
      this.paint(); this.bindTrace();
      const again = $(`[data-prod="${prodId}"]`);
      again?.classList.add('wrong');
      this.selected = null;
    }
  },
  goodConnect(op, prod) {
    Sound.success();
    this.cleared.push(op.id, prod.id);
    this.history.push({opId:op.id, prodId:prod.id, key:op.key});
    Adapt.record(op.a, op.b, true, this.hints ? 'pista' : 'directa', Date.now() - this.started);
    const path = $('#tracePath');
    const prodEl = $(`[data-prod="${prod.id}"]`);
    if (prodEl && path) {
      const c = this.centerOf(prodEl);
      const opEl = $(`[data-op="${op.id}"]`);
      if (opEl) {
        const s = this.centerOf(opEl);
        this.drawPath(s, c, true);
      }
    }
    this.selected = null;
    this.hintText = '';
    if (!lowNow()) {
      const el = prodEl || $('.connect-board');
      if (el) {
        const r = el.getBoundingClientRect();
        Particles.burst(r.left + r.width / 2, r.top + r.height / 2, {count:14, spread:2.4});

    if (clearedNow === 6) {

  undo() {

  },
  showHint() {

    } else {

    }

    if (first) {

      $(`[data-prod="${first.id}"]`)?.classList.add('target');
    }
  },
  nextBoard() {
    if (this.cleared.length < 6) return;
    if (this.board < 1) {

      this.paint(); this.bindTrace();
      window.scrollTo({top:0, behavior: reducedNow() ? 'auto' : 'smooth'});
    } else {
      const stars = this.errors === 0 ? 3 : this.errors <= 2 ? 2 : 1;
      UI.finishActivity({
        worldId:this.worldId, stageId:this.stageId, stars,
        title:'Todo conectado',
        note:'Has atado cada operación con su resultado. La pantalla queda limpia y la idea también.',
        stats:[['Conexiones', 6], ['Despistes', this.errors]],
        repeat:() => UI.go('connect', {worldId:this.worldId, stageId:this.stageId})
      });
    }
  },
  cleanup() {
    this.alive = false;
    this.binded = false;
    if (this.traceAbort) { this.traceAbort.abort(); this.traceAbort = null; }
  }
};
function pairText(p) { return `${p.a} × ${p.b}`; }
/* ============================================================

const GUARDIAN_NAMES = {1:'Bimba', 2:'Tolo', 3:'Gala'};

/* El guardián propone una racha de 6 a 8 preguntas. No reinicia la racha
   cuando hay un fallo: el fallo solo abre una explicación y deja reintentar
   la misma pregunta. Así la racha mide constancia, no velocidad. */
const Boss = {
  worldId: 0,
  world: null,
  count: 6,
  questions: [],
  idx: 0,
  streak: 0,
  errors: 0,
  hints: 0,
  form: 'direct',
  correct: 0,
  options: [],
  wrongValues: new Set(),
  hintText: '',
  speechText: '',
  guardianMood: 'idle',
  locked: false,
  finished: false,
  binded: false,
  alive: false,
  roundStart: 0,
  started: 0,

  start(worldId) {
    this.worldId = Number(worldId);
    this.world = worldById(this.worldId);
    this.count = 6 + (this.worldId >= 2 ? 1 : 0) + (this.worldId >= 3 ? 1 : 0);
    this.questions = Adapt.pick(this.world, this.count);
    this.idx = 0;
    this.streak = 0;
    this.errors = 0;
    this.hints = 0;
    this.finished = false;
    this.alive = true;
    this.binded = false;
    this.started = Date.now();
    this.setupRound();
    Activities.current = this;
    return this.template();
  },

  fact() {
    return this.questions[this.idx] || this.questions[this.questions.length - 1] || {a:1, b:1, key:'1x1'};
  },

  setupRound() {
    const f = this.fact();
    let form = ['direct', 'visual', 'hole', 'inverse'][this.idx % 4];
    // Los grupos muy grandes se preguntan en forma numérica para no llenar la pantalla de puntos.
    if (form === 'visual' && f.a * f.b > 30) form = 'direct';
    this.form = form;
    this.correct = form === 'hole' ? f.b : form === 'inverse' ? f.a : f.a * f.b;
    this.options = this.makeOptions(this.correct);
    this.wrongValues = new Set();
    this.hintText = '';
    this.locked = false;
    this.guardianMood = 'idle';
    this.speechText = this.idx === 0
      ? 'Empecemos con calma. Elige una respuesta; aquí no hay reloj.'
      : 'Otra más. Puedes usar la pista cuando quieras.';
    this.roundStart = Date.now();
  },

  makeOptions(correct) {
    const values = new Set([correct]);
    for (const d of [1, -1, 2, -2, 3, -3, 5]) {
      if (values.size >= 3) break;
      const v = correct + d;
      if (v >= 1 && v <= 100) values.add(v);
    }
    let extra = 4;
    while (values.size < 3) values.add(correct + extra++);
    return shuffleSeed([...values], 13 + this.idx * 17);
  },

  questionSpeech() {
    const f = this.fact();
    if (this.form === 'visual') return `${f.a} grupos de ${f.b}. ¿Cuántos puntos hay?`;
    if (this.form === 'hole') return `${f.a} por un número desconocido es ${f.a * f.b}. ¿Qué número falta?`;
    if (this.form === 'inverse') return `Un número de grupos por ${f.b} es ${f.a * f.b}. ¿Cuántos grupos hay?`;
    return `${f.a} por ${f.b}. ¿Cuánto es?`;
  },

  questionMarkup() {
    const f = this.fact();
    if (this.form === 'visual') {
      const groups = Array.from({length:f.a}, () => `<span class="group-mini">${Array.from({length:f.b}, () => '<span class="dot"></span>').join('')}</span>`).join('');
      return `<div class="equation equation--groups" aria-label="${f.a} grupos de ${f.b}">${groups}</div><p class="equation-hint">¿Cuántos puntos hay en total?</p>`;
    }
    if (this.form === 'hole') {
      return `<div class="equation">${f.a} × <span class="missing">?</span> = ${f.a * f.b}</div><p class="equation-hint">¿Qué número falta?</p>`;
    }
    if (this.form === 'inverse') {
      return `<div class="equation"><span class="missing">?</span> × ${f.b} = ${f.a * f.b}</div><p class="equation-hint">¿Cuántos grupos hay?</p>`;
    }
    return `<div class="equation">${f.a} × ${f.b} = <span class="eq-slot">?</span></div><p class="equation-hint">${esc(this.questionSpeech())}</p>`;
  },

  template() {
    const f = this.fact();
    const dots = Array.from({length:this.count}, (_, i) =>
      `<span class="streak-dot ${i < this.streak ? 'on' : ''}" aria-hidden="true">${i < this.streak ? I.star : I.starLine}</span>`
    ).join('');
    const answers = this.options.map(v => {
      const cls = `${this.locked && v === this.correct ? 'right' : ''} ${this.wrongValues.has(v) ? 'wrong' : ''}`;
      const dis = (this.locked || this.wrongValues.has(v)) ? 'disabled' : '';
      return `<button class="answer-btn ${cls}" type="button" data-answer="${v}" ${dis} aria-label="Respuesta ${v}">${v}</button>`;
    }).join('');
    const body = `<div class="boss-panel" style="--accent-soft:${this.world.soft}">
      <div class="boss-top">
        <div class="guardian ${this.guardianMood}" aria-hidden="true">${guardianArt(this.world, this.guardianMood)}</div>
        <div class="speech" role="status"><span class="speech-name">${esc(GUARDIAN_NAMES[this.worldId] || 'El guardián')}</span><span>${esc(this.speechText)}</span></div>
      </div>
      <div class="boss-question">
        <div class="streak-track" role="img" aria-label="Racha: ${this.streak} de ${this.count} respuestas">
          <span class="streak-label">Racha</span>${dots}
        </div>
        ${this.questionMarkup()}
        <div class="answer-grid" role="group" aria-label="Elige una respuesta">${answers}</div>
      </div>
      ${this.hintText ? `<div class="hint-panel" role="status">${I.bulb}<p>${esc(this.hintText)}</p></div>` : ''}
      ${State.settings.rhythm && !lowNow() ? `<div class="rhythm" aria-hidden="true"><span class="rhythm-dot"></span><span class="rhythm-label">Ritmo opcional · sin prisa</span></div>` : ''}
      <div class="action-row"><span class="status-line">${I.heart} Sin vidas, sin reloj, sin castigos</span><span class="spacer"></span><span class="chip">${this.idx + 1} de ${this.count}</span></div>
    </div>`;
    return `<div class="activity">${activityHeader({
      world:this.world,
      stageName:'El guardián',
      title:'Una racha tranquila',
      instruction:'Responde a tu ritmo. Si algo no sale, verás una pista y podrás intentarlo otra vez.',
      step:this.idx,
      total:this.count,
      body
    })}</div>`;
  },

  paint() {
    const root = $('#activityRoot');
    if (!root) return;
    root.innerHTML = this.template();
  },

  after() {
    const root = $('#activityRoot');
    if (!root) return;
    if (!this.binded) {
      this.binded = true;
      root.addEventListener('click', (e) => {
        if (e.target.closest('[data-back]')) { Sound.whoosh(); UI.go('world', {id:this.worldId}); return; }
        if (e.target.closest('[data-speak]')) {
          Sound.tap();
          Voice.say(`${this.questionSpeech()} ${this.hintText || ''}`.trim(), true);
          return;
        }
        if (e.target.closest('[data-hint]')) { Sound.tap(); this.showHint(); return; }
        const ans = e.target.closest('[data-answer]');
        if (ans) this.respond(Number(ans.dataset.answer));
      });
    }
    this.paint();
  },

  respond(value) {
    if (this.locked || this.finished || !this.alive) return;
    const f = this.fact();
    const latency = Date.now() - this.roundStart;
    if (value === this.correct) {
      this.locked = true;
      this.streak++;
      this.wrongValues = new Set();
      this.hintText = '';
      this.guardianMood = 'happy';
      this.speechText = ['¡Eso es!', 'Muy bien.', 'La tabla se aclara.', 'Exacto.'][(this.streak - 1) % 4];
      Adapt.record(f.a, f.b, true, this.hints ? 'pista' : 'directa', latency);
      Sound.success();
      this.paint();
      announce(`Correcto. Racha ${this.streak} de ${this.count}.`);
      if (this.streak >= this.count) {
        this.finished = true;
        this.speechText = '¡Racha completa! Has llegado hasta el final con calma.';
        Activities.later(() => this.complete(), reducedNow() ? 300 : 1000);
      } else {
        Activities.later(() => {
          this.idx++;
          this.setupRound();
          this.paint();
        }, reducedNow() ? 350 : 850);
      }
      return;
    }

    this.errors++;
    this.wrongValues.add(value);
    this.locked = false;
    this.guardianMood = 'wrong';
    this.speechText = 'Casi. La pista está aquí abajo.';
    this.hintText = `${strategyLine(f.a, f.b)} La pregunta sigue aquí; prueba otra vez.`;
    Adapt.record(f.a, f.b, false, this.hints ? 'pista' : 'directa', latency);
    Sound.neutral();
    this.paint();
    announce(`Todavía no. ${this.hintText}`);
  },

  showHint() {
    const f = this.fact();
    this.hints++;
    this.hintText = `${strategyLine(f.a, f.b)} Puedes contar los grupos o mirar la tabla. La pregunta no cambia.`;
    this.speechText = 'Una pista no es hacer trampa: es mirar por otra ventana.';
    this.paint();
    announce(this.hintText);
  },

  complete() {
    if (!this.alive) return;
    const stars = this.errors === 0 && this.hints === 0 ? 3 : this.errors <= 1 ? 2 : 1;
    UI.finishActivity({
      worldId: this.worldId,
      stageId: 'guardian',
      stars,
      title: 'El guardián sonríe',
      note: 'Has mantenido la racha sin reloj. Cada respuesta fue una ocasión para mirar la tabla con calma.',
      stats: [['Racha', this.count], ['Pistas', this.hints], ['Despistes', this.errors]],
      repeat: () => UI.go('boss', {worldId:this.worldId})
    });
  },

  cleanup() {
    this.alive = false;
    this.binded = false;
  }
};

/* ---------- 7.1 «¿Por qué funciona?» ---------- */
const Why = {
  worldId: 0,
  world: null,
  data: null,
  order: [],
  selected: null,
  checks: 0,
  hintText: '',
  wrongFlag: false,
  solved: false,
  binded: false,
  started: 0,

  start(worldId) {
    this.worldId = Number(worldId);
    this.world = worldById(this.worldId);
    this.data = WHY[this.worldId] || WHY[1];
    this.order = [1, 2, 0];
    this.selected = null;
    this.checks = 0;
    this.hintText = '';
    this.wrongFlag = false;
    this.solved = false;
    this.binded = false;
    this.started = Date.now();
    Activities.current = this;
    return this.template();
  },

  stepArt(kind) {
    const [a, b] = this.data.fact;
    if (kind === 'groups') {
      return Array.from({length:Math.min(a, 5)}, () =>
        `<span class="group-mini">${Array.from({length:b}, () => '<span class="dot"></span>').join('')}</span>`
      ).join('');
    }
    if (kind === 'sum') return `<span class="why-eq">${Array.from({length:Math.min(a, 5)}, () => b).join(' + ')}${a > 5 ? ' + …' : ''}</span>`;
    return `<span class="why-eq">${a} × ${b} = ${a * b}</span>`;
  },

  template() {
    const [a, b] = this.data.fact;
    const p = a * b;
    const steps = this.order.map((stepIndex, pos) => {
      const step = this.data.steps[stepIndex];
      if (!step) return '';
      const cls = `${this.selected === pos ? 'selected' : ''} ${this.solved ? 'good' : ''} ${this.wrongFlag ? 'wrong' : ''}`;
      return `<button class="why-step ${cls}" type="button" data-step-pos="${pos}" ${this.solved ? 'disabled' : ''} aria-pressed="${this.selected === pos}" aria-label="Paso ${pos + 1}: ${esc(step.text)}. ${esc(step.sub)}">
        <span class="step-num" aria-hidden="true">${pos + 1}</span>
        <span class="step-art" aria-hidden="true">${this.stepArt(step.art)}</span>
        <span class="step-copy">${esc(step.text)}<small>${esc(step.sub)}</small></span>
      </button>`;
    }).join('');
    const body = `<div class="workspace split">
      <div class="panel pad">
        <p class="kicker">La idea en tres pasos</p>
        <h2>Ordena la explicación</h2>
        <p class="tiny" style="margin:5px 0 13px">Toca un paso y luego otro para cambiarlos de sitio. No hay prisa.</p>
        <div class="why-steps" role="list">${steps}</div>
        ${this.hintText ? `<div class="hint-panel" role="status">${I.bulb}<p>${esc(this.hintText)}</p></div>` : ''}
        <div class="action-row">
          <button class="btn btn-primary" type="button" data-check-why ${this.solved ? 'disabled' : ''}>${I.check} Comprobar</button>
          <button class="btn btn-ghost btn-small" type="button" data-reset-why ${this.solved ? 'disabled' : ''}>${I.refresh} Reiniciar</button>
        </div>
      </div>
      <aside class="panel pad" style="text-align:center">
        <p class="kicker">La misma verdad</p>
        <p class="hand" style="margin:6px 0">${a} grupos de ${b}</p>
        <div class="equation" aria-label="${a} por ${b} igual a ${p}">${a} × ${b} = <span class="eq-slot">${p}</span></div>
        <p class="tiny" style="margin-top:10px">Multiplicar es una forma corta de sumar grupos iguales. La cifra grande no aparece por arte de magia: cuenta lo que hay.</p>
        <div class="row" style="justify-content:center;margin-top:12px"><span class="chip">${I.heart} Sin notas</span><span class="chip">${I.eye} Sin prisa</span></div>
      </aside>
    </div>`;
    return `<div class="activity">${activityHeader({
      world:this.world,
      stageName:'¿Por qué funciona?',
      title:'Una idea que encaja',
      instruction:'Ordena los tres pasos: primero los grupos, después la suma y al final la cuenta corta.',
      step:4,
      total:6,
      body
    })}</div>`;
  },

  paint() {
    const root = $('#activityRoot');
    if (!root) return;
    root.innerHTML = this.template();
  },

  after() {
    const root = $('#activityRoot');
    if (!root) return;
    if (!this.binded) {
      this.binded = true;
      root.addEventListener('click', (e) => {
        if (e.target.closest('[data-back]')) { Sound.whoosh(); UI.go('world', {id:this.worldId}); return; }
        if (e.target.closest('[data-speak]')) {
          Sound.tap();
          Voice.say($('#instruction')?.textContent || 'Ordena los pasos.', true);
          return;
        }
        if (e.target.closest('[data-hint]')) { Sound.tap(); this.showHint(); return; }
        if (e.target.closest('[data-check-why]')) { this.check(); return; }
        if (e.target.closest('[data-reset-why]')) { this.reset(); return; }
        const step = e.target.closest('[data-step-pos]');
        if (step) this.choose(Number(step.dataset.stepPos));
      });
    }
    this.paint();
  },

  choose(pos) {
    if (this.solved) return;
    if (this.selected === null) {
      this.selected = pos;
      this.wrongFlag = false;
      Sound.pop(540);
      this.paint();
      return;
    }
    if (this.selected === pos) {
      this.selected = null;
      this.paint();
      return;
    }
    const a = this.selected;
    const b = pos;
    [this.order[a], this.order[b]] = [this.order[b], this.order[a]];
    this.selected = null;
    this.wrongFlag = false;
    this.hintText = '';
    Sound.pop(680);
    this.paint();
    announce('Pasos cambiados de sitio.');
  },

  check() {
    if (this.solved) return;
    this.checks++;
    const ok = this.order.every((v, i) => v === i);
    if (ok) {
      this.solved = true;
      this.selected = null;
      this.wrongFlag = false;
      this.hintText = '';
      const [a, b] = this.data.fact;
      Adapt.record(a, b, true, 'concepto', Date.now() - this.started);
      Sound.success();
      this.paint();
      announce('La explicación está ordenada. Grupos, suma repetida y multiplicación.');
      Activities.later(() => this.finish(), reducedNow() ? 300 : 900);
    } else {
      this.wrongFlag = true;
      this.selected = null;
      this.hintText = 'Casi. Empieza por el paso que enseña los grupos iguales y deja para el final la cuenta con el signo ×.';
      Sound.neutral();
      this.paint();
      announce(this.hintText);
    }
  },

  showHint() {
    this.hintText = 'Primero se ven los grupos iguales; después se suman sus valores; al final se escribe la multiplicación.';
    Sound.pop(500);
    this.paint();
    announce(this.hintText);
  },

  reset() {
    if (this.solved) return;
    this.order = [1, 2, 0];
    this.selected = null;
    this.wrongFlag = false;
    this.hintText = '';
    Sound.whoosh();
    this.paint();
  },

  finish() {
    if (!this.solved) return;
    const stars = this.checks <= 1 ? 3 : this.checks === 2 ? 2 : 1;
    UI.finishActivity({
      worldId: this.worldId,
      stageId: 'why',
      stars,
      title: 'La idea encaja',
      note: 'Has ordenado la misma verdad de tres maneras: grupos, suma repetida y multiplicación. Ya sabes por qué funciona.',
      stats: [['Intentos', this.checks]],
      repeat: () => UI.go('why', {worldId:this.worldId})
    });
  },

  cleanup() { this.binded = false; }
};

/* ---------- 7.2 Recompensa y criatura-regleta ---------- */
const Reward = {
  worldId: 0,
  world: null,
  creature: null,
  first: false,
  alive: false,
  binded: false,

  start(worldId) {
    this.worldId = Number(worldId);
    this.world = worldById(this.worldId);
    this.creature = creatureById(this.world.creature);
    this.first = !State.stage(this.worldId, 'reward').done;
    this.alive = true;
    this.binded = false;
    if (this.first) {
      // La recompensa se guarda al entrar: si se cierra la pestaña justo después,
      // la criatura no se pierde. Estado.award es idempotente para las gemas.
      State.award(this.worldId, 'reward', 0);
      Session.creatures++;
      State.save();
      Sound.refreshLayers();
    }
    UI.updateChrome();
    return this.template();
  },

  template() {
    const c = this.creature;
    const w = this.world;
    const already = !this.first;
    return `<div class="reward" style="--accent-soft:${w.soft}">
      <div class="row" style="justify-content:space-between;width:100%">
        <button class="btn btn-ghost btn-small" type="button" data-back-reward>${I.left} Volver al mundo</button>
        <button class="btn btn-ghost btn-small" type="button" data-speak-reward>${I.speaker} Leer</button>
      </div>
      <p class="kicker">Mundo ${w.id} · ${already ? 'Ya está en tu álbum' : 'Una nueva amiga'}</p>
      <h1>${already ? `${esc(c.name)} te espera` : `¡${esc(c.name)} despierta!`}</h1>
      <div class="reward-art" aria-hidden="true">
        <span class="reward-glow"></span>
        ${creatureArt(c.id, {mood:'cheer'})}
        <span class="sparkles" aria-hidden="true">${I.star}</span>
      </div>
      <p class="reward-tag">${esc(c.tag)}</p>
      <p class="lead" style="max-width:42ch">${already ? `La criatura-regleta de ${esc(w.name)} ya vive en tu álbum. Puedes visitarla siempre que quieras.` : `Ha despertado al completar ${esc(w.name)}. Su regleta guarda ${esc(w.label)} y una idea: las tablas son grupos iguales.`}</p>
      <div class="row" style="justify-content:center;gap:8px">
        <span class="chip chip-gold">${I.gem} Gema del mundo</span>
        <span class="chip chip-green">${I.check} En el álbum</span>
      </div>
      <div class="action-row" style="justify-content:center">
        <button class="btn btn-primary" type="button" data-continue-reward>${I.home} Seguir el mapa</button>
        <button class="btn btn-soft" type="button" data-album-reward>${I.heart} Ver en el álbum</button>
      </div>
      ${this.first ? `<p class="tiny">La caja se abre despacio. No hay prisa por cerrar este momento.</p>` : ''}
    </div>`;
  },

  after() {
    const root = $('#activityRoot');
    if (!root) return;
    if (!this.binded) {
      this.binded = true;
      root.addEventListener('click', (e) => {
        if (e.target.closest('[data-back-reward]')) { Sound.whoosh(); UI.go('world', {id:this.worldId}); return; }
        if (e.target.closest('[data-speak-reward]')) {
          Sound.tap();
          Voice.say(`Has liberado a ${this.creature.name}, la criatura-regleta de ${this.world.name}.`, true);
          return;
        }
        if (e.target.closest('[data-continue-reward]')) { Sound.tap(); UI.go('hub'); return; }
        if (e.target.closest('[data-album-reward]')) { Sound.tap(); UI.go('album'); return; }
      });
    }
    if (this.first) {
      Activities.later(() => {
        if (!this.alive) return;
        Sound.hatch();
        if (!lowNow()) {
          const art = $('.reward-art', root);
          if (art) {
            const r = art.getBoundingClientRect();
            Particles.burst(r.left + r.width / 2, r.top + r.height / 2, {count:30, spread:3.6, petal:true});
          }
          Particles.celebrate();
        }
        announce(`${this.creature.name} se ha unido al álbum.`);
      }, reducedNow() ? 250 : 500);
      this.first = false;
    }
  },

  cleanup() { this.alive = false; this.binded = false; }
};

/* ---------- 7.3 Registro de pantallas con raíz de actividad ---------- */
function activityScreen(params, starter, after) {
  return {
    html:`<section class="screen"><div class="container"><div id="activityRoot">${starter(params)}</div></div></section>`,
    after
  };
}

SCREENS.discover = ({worldId}) => activityScreen({worldId}, (p) => Discover.start(p.worldId), () => Discover.after());

SCREENS.bars = ({worldId, stageId}) => activityScreen({worldId, stageId}, (p) => {
  Bars.stageId = p.stageId || 'game1';
  return Bars.start(p.worldId, p.stageId);
}, () => Bars.after());

SCREENS.target = ({worldId, stageId}) => activityScreen({worldId, stageId}, (p) => Target.start(p.worldId, p.stageId || 'game1'), () => Target.after());

SCREENS.connect = ({worldId, stageId}) => activityScreen({worldId, stageId}, (p) => Connect.start(p.worldId, p.stageId || 'game2'), () => Connect.after());

SCREENS.boss = ({worldId}) => activityScreen({worldId}, (p) => Boss.start(p.worldId), () => Boss.after());

SCREENS.why = ({worldId}) => activityScreen({worldId}, (p) => Why.start(p.worldId), () => Why.after());

SCREENS.reward = ({worldId}) => activityScreen({worldId}, (p) => Reward.start(p.worldId), () => Reward.after());

/* ---------- 7.4 Arranque ---------- */
function boot() {
  try {
    App.init();
    // El audio se desbloquea con el primer gesto; aquí solo se preparan las capas.
    if (State.p) Sound.refreshLayers();
  } catch (err) {
    console.error('No se pudo arrancar Caja de Estrellas:', err);
    const main = $('#main');
    if (main) {
      main.innerHTML = `<section class="screen"><div class="container"><div class="panel pad" style="max-width:620px;margin:20px auto">
        <h1>La caja necesita un momento</h1>
        <p class="lead">Algo no ha cargado bien. Cierra y vuelve a abrir el archivo; el progreso guardado no se borra.</p>
        <button class="btn btn-primary" type="button" onclick="location.reload()">Reintentar</button>
      </div></div></section>`;
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, {once:true});
} else {
  boot();
}
</script>
